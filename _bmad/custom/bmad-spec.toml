[workflow]
activation_steps_append = [
  "规格批准入口：核对同一当前spec及AC、代码映射、边界与来源；PM负责范围/批准协调，dev-user独立负责用户判断。审批必须匹配当前冻结意图，不能用旧裁决批准已变更scope/spec/assumptions。"
]
persistent_facts = [
  "规格出口：已有产物记录 delegated approval by dev-user/dev-pm under maintainer authorization 2026-10-10，并附当前spec身份及理由；这是授权范围内代理批准，不是直接人类回复、标准偏离或发布授权。客户拒绝返回相关规格/方案，PM调查协调窄返工，不能无证据覆盖；过期证据仅请求必要窄复核。",
  "每个开发任务明确目标branch、commit/integration/publication具体权限与工程出口；权限不足时PM调查后带一项建议升级秘书，报告部分完成/待集成，不能静默删除AC或把未集成候选称交付。独立调查可并行，冻结规格批准和同文件写入单owner串行。权限/架构兼容承诺冲突或AC削弱仍保留真实授权升级。",
  "规格/场景分歧、客户拒收或跨角色阻塞才按需讨论：PM主持相关owner，以原卡comments/既有产物记录议题、证据、决定/理由、下一行动owner/AC；沿现有无死锁支持机制和秘书native unblock，不用固定会议、Party Mode模拟裁决或投票关闭缺证门槛。"
]
on_complete = "PM交接已批准同一规格、选定skill/action/artifact、范围/AC/依赖/目标分支及具体权限；保留原规格为唯一来源，不复制第二规格。spec done/规划完成不等独立QA、客户结果裁决或工程交付，不自动释放未授权backlog。"
