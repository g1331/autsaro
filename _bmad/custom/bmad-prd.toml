[workflow]
activation_steps_append = [
  "阶段入口：PM先定位实际brief/PRD/journeys、已授权目标及产品用户/用途；缺事实先定向调查，标记有依据的假设，不虚构用户经历或直接人类答复。dev-user独立负责用户需求/场景判断，PM负责范围、优先级与可检验场景；沿用原PRD，不新造治理文档。"
]
persistent_facts = [
  "需求/场景出口：既有PRD中范围与可检验场景获当前有效客户裁决和PM确认才交下游；未解决分歧回原需求/场景，由PM组织定向调查→dev-user裁决，不用投票、模拟会议或PM无证据覆盖客户拒绝。独立调查可并行，同产物审批/写入单owner串行。",
  "仅在需求/场景分歧或实质范围冲突时按需讨论：PM主持，仅相关owner参加，在原卡comments/既有BMad产物记录议题、所需证据、决定及理由、下一行动owner/AC；跨角色阻塞沿现有无死锁支持卡协调，由秘书执行native unblock。无固定会议、定时检查、轮询或Party Mode角色表演；触及真实授权/兼容承诺/AC削弱时调查后带一项建议升级秘书。"
]
on_complete = "PM维护产品/客户理解、范围/优先级、依赖/资源、阻塞与变更、QA返工、客户反馈、提交集成、最终出口及剩余风险的任务内闭环，不仅建卡或转述；其他owner不重复PM，秘书不是第二日常调度。需求阶段完成/规划complete不等工程交付；仅按已授权范围交接原产物，不能自动启动新backlog。"
