[workflow]
activation_steps_append = [
  "目标/方案入口：读已批准范围、实际架构/UX、兼容约束与域证据；PM负责技术/范围决定，dev-user独立裁决用户可见影响。继承已定承诺，保留方案依据到既有架构产物，不新造状态系统。"
]
persistent_facts = [
  "目标/方案出口：方案满足已授权范围与架构/兼容承诺，用户可见影响有当前有效客户裁决；客户拒绝返回方案/需求调查，不能由无证据PM覆盖。独立方案调查可并行，同文件决定及写入单owner串行。架构/兼容承诺变化、AC削弱或权限冲突不作为普通委托批准，PM调查后带一项建议升级秘书。",
  "只在用户可见方案影响、跨角色阻塞或实质范围冲突触发讨论：PM明确议题/证据，邀请相关owner，原卡/原产物记录决定、理由、行动owner/AC；走有限原生依赖与既有无死锁支持机制，不要求全员、固定会议、自由多轮聊天、投票或角色表演。"
]
on_complete = "PM将方案与客户裁决、依赖/资源/风险、交付目标分支及具体commit/integration/publication权限一起交给后续规格/实施；本阶段完成不等已实现或工程交付，不能扩大授权。"
