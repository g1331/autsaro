version: 2
# Monthly version updates, one grouped pull request per ecosystem; security updates are separate.
# A release must be a week old before it is proposed, so a hijacked release has time to be pulled.
# Every push to an update branch re-runs the full required CI, so Dependabot does not rebase on
# its own; comment "@dependabot rebase" just before merging.
# Version updates propose minor and patch releases only; major upgrades are done by hand (#153).
# Alerts still report vulnerabilities, and cargo-deny and osv-scanner fail the required checks.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      time: "03:00"
      timezone: Asia/Shanghai
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "03:00"
      timezone: Asia/Shanghai
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot treats pre-1.0 breaking releases as minor; review the next sha2 API change.
      - dependency-name: sha2
        versions: [">= 0.12"]
      # tauri build requires the Rust crates and the @tauri-apps npm packages on the same
      # minor release; upgrade both sides by hand in one pull request.
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
      time: "03:00"
      timezone: Asia/Shanghai
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.71.2 requires TypeScript <6.1.0; remove when its stable peer
      # range supports TypeScript 7 and lint/build/tests pass. See #153.
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
      # Kept on the same minor release as the tauri crates; see the cargo entry.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "03:00"
      timezone: Asia/Shanghai
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      # Both come from the same LLVM release; review them together, since PyPI can publish
      # one before the other.
      clang-tools:
        patterns: ["clang-format", "clang-tidy"]
      uv:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
