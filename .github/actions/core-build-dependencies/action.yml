name: Core build dependencies
description: Install the libxml2 and libclang toolchain that builds autosar-config-core
inputs:
  linux-packages:
    description: Additional apt packages the calling job needs
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Linux core dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        LINUX_PACKAGES: ${{ inputs.linux-packages }}
      # Word splitting turns the space-separated input into package arguments.
      run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev clang pkg-config $LINUX_PACKAGES
    - name: Identify vcpkg cache image
      id: vcpkg-image
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
        New-Item -ItemType Directory -Force -Path build/vcpkg-cache | Out-Null
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: runner.os == 'Windows'
      with:
        path: build/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ steps.vcpkg-image.outputs.image }}-static-md-v1
        restore-keys: vcpkg-${{ runner.os }}-
    - name: Windows core dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      # Fixed runner paths for the build that follows; no workflow runs on untrusted triggers.
      run: | # zizmor: ignore[github-env]
        $env:VCPKG_DEFAULT_BINARY_CACHE = (Resolve-Path build/vcpkg-cache).Path
        vcpkg install 'libxml2[iconv,zlib]:x64-windows-static-md'
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        'VCPKGRS_TRIPLET=x64-windows-static-md' >> $env:GITHUB_ENV
        'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> $env:GITHUB_ENV
