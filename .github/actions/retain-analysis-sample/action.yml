name: Retain one analysis sample
description: Publish the raw comparison, scope and full replay artifacts of one sample
inputs:
  sample:
    description: Generated sample name
    required: true
  target:
    description: Controlled compiler target
    required: true
  side:
    description: Current or baseline source tree
    required: true
  index:
    description: Matrix job index for duplicate detection
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: c-analysis-raw-${{ inputs.side }}-${{ inputs.target }}-${{ inputs.sample }}-${{ inputs.index }}
        overwrite: true
        path: |
          build/analysis-output/${{ inputs.sample }}/*/summary.json
          build/analysis-output/${{ inputs.sample }}/*/project
          build/analysis-output/${{ inputs.sample }}/*/analysis-identity.json
          build/analysis-output/${{ inputs.sample }}/*/diagnostic-fingerprints.json
          build/analysis-output/${{ inputs.sample }}/*/identifier-evidence
          build/analysis-output/${{ inputs.sample }}/*/baseline-source.json
          build/analysis-output/${{ inputs.sample }}/*/platform-model.h
          build/analysis-output/${{ inputs.sample }}/*/platform-library.cfg
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: c-analysis-scope-${{ inputs.side }}-${{ inputs.target }}-${{ inputs.sample }}-${{ inputs.index }}
        overwrite: true
        path: build/analysis-output/${{ inputs.sample }}/*/scope-input.json
        if-no-files-found: error
        retention-days: 14

    # Full target-host replay inputs are retained once, outside the comparison bundle.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: c-analysis-${{ inputs.side == 'baseline' && 'baseline-' || '' }}${{ inputs.target }}-${{ inputs.sample }}
        overwrite: true
        path: build/analysis-output/${{ inputs.sample }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
