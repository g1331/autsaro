name: Native analysis compiler
description: Install and validate the controlled native GCC used by C analysis
runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      if: runner.os == 'Windows'
      with:
        msystem: MINGW64
        path-type: inherit
    - name: Install locked native GCC
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        pacman --noconfirm -Sy
        mkdir -p build/native-gcc
        cd build/native-gcc
        for package in mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst; do
          curl --fail --location --retry 3 --output "$package" "https://repo.msys2.org/mingw/mingw64/$package"
          curl --fail --location --retry 3 --output "$package.sig" "https://repo.msys2.org/mingw/mingw64/$package.sig"
        done
        printf '%s\n' '10f7c55275f7fbe7924209d61c368a1a6fcf775cffbdeac2eef1f5ccacdd35cd  mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst' 'aa560f5438c35b71c3e7b24fd5becbca028f70c5b4d1f1697a86ff80fec947da  mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst' | sha256sum --check --strict
        pacman --noconfirm -U mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst
    - name: Validate native compiler headers
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        @'
        import os, subprocess, tempfile
        from pathlib import Path
        from autosar_tooling.c_check import compiler_include_paths
        compiler = (Path(os.environ['MSYS2_LOCATION']) / 'mingw64/bin/gcc.exe').resolve(strict=True)
        source = Path('build/native-gcc/headers.c')
        source.write_text('#include <stdio.h>\nint main(void) { return 0; }\n', encoding='utf-8')
        with tempfile.TemporaryDirectory() as temporary:
            directory = Path(temporary).resolve(strict=True)
            result = subprocess.run([str(compiler), '-std=c99', '-E', '-v', str(source.resolve())], cwd=directory, capture_output=True, text=True, check=True)
            print('Compiler:', compiler, flush=True)
            print(result.stderr, flush=True)
            print('Native header directories:', compiler_include_paths(result.stderr, directory), flush=True)
        '@ | uv run --locked python -
    - name: Select native GCC
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: (Join-Path $env:MSYS2_LOCATION 'mingw64/bin') >> $env:GITHUB_PATH
