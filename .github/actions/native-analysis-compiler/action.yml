name: Native analysis compiler
description: Install and validate the controlled native GCC used by C analysis
runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      if: runner.os == 'Windows'
      with:
        # Reuse the hosted image; GCC/binutils are still installed and verified below.
        release: false
        msystem: MINGW64
        path-type: inherit
    - name: Identify native package cache image
      id: package-image
      if: runner.os == 'Windows'
      shell: python
      run: |
        import os
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write('image=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: gcc-download-cache
      if: runner.os == 'Windows'
      with:
        path: build/native-gcc/packages
        # The action contains every URL, package hash and installation instruction.
        key: >-
          ${{ format('native-gcc-packages-{0}-{1}-{2}-{3}',
          runner.os, runner.arch, steps.package-image.outputs.image,
          hashFiles('.github/actions/native-analysis-compiler/action.yml')) }}
    - name: Install locked native GCC
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        PACKAGE_CACHE_HIT: ${{ steps.gcc-download-cache.outputs.cache-hit }}
      run: |
        # -U still downloads missing dependencies; use the primary for both sync and install.
        printf '%s\n' 'Server = https://repo.msys2.org/mingw/$repo' > /etc/pacman.d/mirrorlist.mingw
        printf '%s\n' 'Server = https://repo.msys2.org/msys/$arch' > /etc/pacman.d/mirrorlist.msys
        cat /etc/pacman.d/mirrorlist.mingw /etc/pacman.d/mirrorlist.msys
        # Require the downloaded sidecar signatures for local packages as well.
        sed -i 's/^LocalFileSigLevel[[:space:]]*=.*/LocalFileSigLevel = Required/' /etc/pacman.conf
        pacman --noconfirm -Sy
        mkdir -p build/native-gcc/packages
        cd build/native-gcc/packages
        if [[ "$PACKAGE_CACHE_HIT" != true ]]; then
          for package in \
            mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst \
            mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst \
            mingw-w64-x86_64-binutils-2.47-4-any.pkg.tar.zst; do
            curl --fail --location --retry 3 --output "$package" \
              "https://repo.msys2.org/mingw/mingw64/$package"
            curl --fail --location --retry 3 --output "$package.sig" \
              "https://repo.msys2.org/mingw/mingw64/$package.sig"
          done
        fi
        printf '%s\n' '10f7c55275f7fbe7924209d61c368a1a6fcf775cffbdeac2eef1f5ccacdd35cd  mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst' 'aa560f5438c35b71c3e7b24fd5becbca028f70c5b4d1f1697a86ff80fec947da  mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst' 'e36c52a7fe1d104c2efd97dc74162386eabf8323f6aeb9b83aeb574b291a7da0  mingw-w64-x86_64-binutils-2.47-4-any.pkg.tar.zst' | sha256sum --check --strict
        pacman --noconfirm -U mingw-w64-x86_64-gcc-16.1.0-5-any.pkg.tar.zst mingw-w64-x86_64-gcc-libs-16.1.0-5-any.pkg.tar.zst mingw-w64-x86_64-binutils-2.47-4-any.pkg.tar.zst
        pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-libs mingw-w64-x86_64-binutils
    - name: Select native GCC
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      # The setup action's own install location; no workflow runs on untrusted triggers.
      run: (Join-Path $env:MSYS2_LOCATION 'mingw64/bin') >> $env:GITHUB_PATH # zizmor: ignore[github-env]
    - name: Validate native compiler headers
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        @'
        import hashlib, os, subprocess, tempfile
        from pathlib import Path
        from ecu_tools.build import compiler_include_paths
        compiler = (Path(os.environ['MSYS2_LOCATION']) / 'mingw64/bin/gcc.exe').resolve(strict=True)
        source = Path('build/native-gcc/headers.c')
        source.write_text('#include <stdio.h>\nint main(void) { return 0; }\n', encoding='utf-8')
        with tempfile.TemporaryDirectory() as temporary:
            directory = Path(temporary).resolve(strict=True)
            result = subprocess.run([str(compiler), '-std=c99', '-E', '-v', str(source.resolve())], cwd=directory, capture_output=True, text=True, check=True)
            print('Compiler:', compiler, flush=True)
            print(result.stderr, flush=True)
            print('Native header directories:', compiler_include_paths(result.stderr, directory), flush=True)
        linker_name = subprocess.run([str(compiler), '-print-prog-name=ld'], capture_output=True, text=True, check=True, timeout=30).stdout.strip()
        print('Native linker query:', linker_name, flush=True)
        linker = Path(linker_name)
        if linker.is_absolute():
            linker = linker.resolve(strict=True)
            print('Native linker path:', linker, flush=True)
            print('Native linker SHA256:', hashlib.sha256(linker.read_bytes()).hexdigest(), flush=True)
            print(subprocess.run([str(linker), '--version'], capture_output=True, text=True, check=True, timeout=30).stdout, flush=True)
        else:
            print('Native linker resolution: relative query result remains unverified', flush=True)
        '@ | uv run --locked python -
