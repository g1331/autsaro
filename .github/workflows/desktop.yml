name: Isolated desktop acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [linux, windows, macos]
        required: true
      binary:
        description: Absolute path to the current built or extracted application
        required: true
      installed:
        type: boolean
        default: false
      source_checkout:
        description: Original build checkout for installed verification
        required: false
      builtin_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    runs-on: [self-hosted, autosar-controlled, "${{ inputs.platform == 'linux' && 'Linux' || inputs.platform == 'windows' && 'Windows' || 'macOS' }}"]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: cargo build --locked --manifest-path core/Cargo.toml --bins
      - name: Run isolated acceptance
        shell: python
        env:
          PLATFORM: ${{ inputs.platform }}
          BINARY: ${{ inputs.binary }}
          INSTALLED: ${{ inputs.installed }}
          SOURCE: ${{ inputs.source_checkout }}
          BUILTIN: ${{ inputs.builtin_only }}
        run: |
          import os, subprocess
          command = ['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling', 'desktop', '--platform', os.environ['PLATFORM'], '--binary', os.environ['BINARY'], '--output-directory', 'desktop-results']
          if os.environ['INSTALLED'] == 'true':
              command += ['--installed', '--source-checkout', os.environ['SOURCE']]
          if os.environ['BUILTIN'] == 'true':
              command += ['--builtin-only']
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: desktop-${{ inputs.platform }}
          path: |
            desktop-results
            !desktop-results/**/dependencies/**
          if-no-files-found: ignore
