name: Architecture diagrams
# Draws the README and roadmap architecture diagrams from the requirement accounting
# (ADR 0017) against the licensed R24-11 archive and publishes them to GitHub Pages.
# Only the SVG files are published; the archives stay in a private cache and are never
# uploaded or printed. Runs when a disposition source changes on master.
on:
  push:
    branches: [master]
    paths:
      - 'docs/standards/**'
      - 'core/tests/**'
      - 'tests/**'
      - 'core/resources/official.json'
      - 'tools/python/src/autosar_tooling/coverage.py'
      - 'tools/python/src/autosar_tooling/requirements.py'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: archives
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - name: Download and verify official archives
        run: uv run --locked python -m autosar_tooling fetch-official
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.archives.outputs.cache-hit != 'true'
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - name: Draw the diagrams
        run: uv run --locked python -m autosar_tooling coverage --output site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  publish:
    needs: draw
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
