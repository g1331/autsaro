# Temporary #61 experiment; removed before merge.
name: Timing probe
on:
  push:
    branches: [fix/windows-protocol-timing]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fix]
        slot: [1, 2, 3, 4, 5, 6]
    name: probe (${{ matrix.variant }}, ${{ matrix.slot }})
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Remove the idle fix (baseline)
        if: matrix.variant == 'baseline'
        shell: python
        run: |
          import re, subprocess
          from pathlib import Path
          path = Path('runtime/os/src/Os_Backend.c')
          text = path.read_bytes()
          patched, count = re.subn(rb'\n    /\* Give the host CPU back:.*?Sleep\(1u\);', b'', text, flags=re.S)
          assert count == 1, count
          path.write_bytes(patched)
          subprocess.run(['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling', 'assets', 'update'], check=True)
      - name: Build native tests
        run: cargo test --locked -p autosar-config-core --features native-tests --test native --no-run
      - name: Stress
        shell: python
        run: |
          import os, subprocess, sys, tempfile, time
          from pathlib import Path
          binary = max(Path('target/debug/deps').glob('native-*.exe'), key=lambda p: p.stat().st_mtime)
          out = Path('probe-logs'); out.mkdir()
          test = 'integration::protocol::single_component_meets_independent_protocol_and_timing_vectors'
          # Two slow shards at once: the required job's load, doubled.
          command = [str(binary), 'integration::sealed_projects', 'integration::single_component', 'integration::protocol']
          print('CPUs', os.cpu_count(), flush=True)
          failed = 0
          failed_runs = []
          runs = 0
          started = time.monotonic()
          while time.monotonic() - started < 35 * 60:
              procs = []
              for _ in range(2):
                  env = dict(os.environ, AUTOSAR_TIMING_PROBE=str((out / f'run{runs}.log').absolute()))
                  log = open(out / f'run{runs}.out', 'w')
                  procs.append((f'run{runs}', subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, env=env), log))
                  runs += 1
              for name, proc, log in procs:
                  code = proc.wait(); log.close()
                  if code != 0:
                      failed += 1
                      failed_runs.append(name)
                  print(f'{name}: exit {code} at {time.monotonic() - started:.0f}s', flush=True)
          load = 'two slow shards'
          spans, aborts = [], []
          for f in out.glob('run*.log'):
              for line in f.read_text(errors='replace').splitlines():
                  v = dict(kv.split('=', 1) for kv in line.split() if '=' in kv)
                  if line.startswith('abort'):
                      if f.stem in failed_runs:
                          aborts.append(f.name + ': ' + line)
                  elif int(v.get('span', 0)) >= 100:
                      spans.append((int(v['elapsed']) / int(v['span']), line))
          spans.sort()
          q = lambda p: spans[min(len(spans) - 1, int(p * len(spans)))][0]
          print(f'== {load}: runs={runs} failed={failed} batches(span>=100)={len(spans)}')
          if spans:
              print('   ms/tick p50=%.2f p90=%.2f p99=%.2f max=%.2f' % (q(.5), q(.9), q(.99), spans[-1][0]))
              print('   slowest batches:')
              for _, line in spans[-5:]:
                  print('    ', line)
          print('   aborts in failed runs (fault tests abort deliberately):')
          for a in aborts:
              print('    ', a)
          for f in sorted(out.glob('run*.out')):
              text = f.read_text(errors='replace')
              if 'FAILED' in text:
                  print('----', f.name)
                  print('\n'.join(l for l in text.splitlines() if 'FAILED' in l or 'panicked' in l or 'state=Failed' in l or 'cases' in l))
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.variant }}-${{ matrix.slot }}
          path: probe-logs
          retention-days: 7
