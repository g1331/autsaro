name: Extended checks
# Checks outside the required pull request layer (checks.yml), selected by the
# changed paths: the rest of the Python and UI matrices, Desktop acceptance and
# the official archive comparison, the full offline receiver matrix and bounded fuzzing. Runs after every push to
# master; a pull request runs Desktop acceptance, the official comparison and fuzzing for their paths,
# and everything once it carries the full-ci label. Not part of the required checks.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  # Adding an unrelated label must not cancel a run in progress.
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONPATH: tools/python/src
jobs:
  changes:
    name: Select extended checks
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.select.outputs.python }}
      ui: ${{ steps.select.outputs.ui }}
      desktop: ${{ steps.select.outputs.desktop }}
      official: ${{ steps.select.outputs.official }}
      receiver: ${{ steps.select.outputs.receiver }}
      fuzz: ${{ steps.select.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        shell: python
        env:
          # A pull request compares its merge commit with the first parent, the base it merges onto;
          # pull_request.base.sha can predate newer master commits that the merge ref already holds.
          BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          import os, subprocess
          event = os.environ['GITHUB_EVENT_NAME']
          base = os.environ['BASE']
          files = None
          if os.environ['FULL'] != 'true' and base and set(base) != {'0'}:
              diff = subprocess.run(['git', 'diff', '--name-only', base, os.environ['GITHUB_SHA']], capture_output=True, text=True)
              files = diff.stdout.split() if diff.returncode == 0 else None
          if files is not None:
              print('\n'.join(files))
          def touched(*prefixes):
              return any(path.startswith(prefixes) for path in files)
          # A manual run, the full-ci label, an unknown baseline or a change to this workflow selects everything.
          if files is None or '.github/workflows/extended.yml' in files:
              selected = dict.fromkeys(['python', 'ui', 'desktop', 'official', 'receiver', 'fuzz'], True)
          else:
              # Pull requests already run Linux and Windows; the other interpreters and macOS differ only in these sources.
              push = event != 'pull_request'
              selected = {
                  'python': push and touched('tools/', 'tests/python/', 'scripts/', 'pyproject.toml', 'uv.lock', '.python-version', '.github/workflows/checks.yml'),
                  'receiver': push and touched('core/', 'runtime/', 'tools/', 'tests/python/', 'Cargo.toml', 'Cargo.lock',
                      'rust-toolchain.toml', 'pyproject.toml', 'uv.lock', '.python-version', '.github/actions/', '.github/workflows/checks.yml'),
                  'ui': push and touched('ui/', '.node-version', '.github/workflows/checks.yml'),
                  'desktop': touched('ui/', 'src-tauri/', 'tests/desktop/', '.github/workflows/desktop.yml')
                      or push and touched('core/', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.node-version', '.github/actions/'),
                  'official': touched('core/src/definitions.rs', 'core/src/definitions/', 'core/src/schema.rs', 'core/src/rules.rs',
                      'core/src/rules/', 'core/resources/official.json', 'core/resources/requirements/', 'core/tests/official/',
                      'tools/python/src/autosar_tooling/official.py', 'tools/python/src/autosar_tooling/requirements.py',
                      'docs/standards/', '.github/workflows/acceptance.yml'),
                  # The fuzz targets' inputs: ARXML parsing and import, definitions, CanTp, Dcm and their host areas.
                  'fuzz': touched('fuzz/', 'core/src/arxml', 'core/src/integration/', 'core/src/definitions', 'core/src/xml_paths.rs',
                      'core/src/project_model.rs', 'core/resources/', 'core/Cargo.toml', 'runtime/bsw/include/', 'runtime/bsw/src/CanTp',
                      'runtime/bsw/src/Dcm', 'runtime/host/', 'core/tests/fixtures/bsw-contracts/'),
              }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, value in selected.items():
                  print(name + '=' + str(value).lower())
                  output.write(name + '=' + str(value).lower() + '\n')
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
        # checks.yml runs these on every pull request and push.
        exclude:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tools tests/python scripts
      - run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python
      - run: uv build --out-dir build/python
  receiver:
    needs: changes
    if: needs.changes.outputs.receiver == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: build-essential
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: receiver-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Generate complete receiver samples
        run: python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core --test it -- 'c_analysis::'
      - name: All moved samples build and run with receiver Python 3.11–3.14
        shell: python
        run: |
          import os, subprocess, sys
          failed = []
          for version in ('3.11', '3.12', '3.13', '3.14'):
              subprocess.run(['uv', 'python', 'install', '--no-bin', version], check=True)
              receiver = subprocess.check_output(['uv', 'python', 'find', '--no-project', '--managed-python', version], text=True).strip()
              print(f'::group::Receiver Python {version}: {receiver}', flush=True)
              result = subprocess.run(['python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', 'uv', 'run', '--locked', 'python', '-B', '-m', 'unittest', 'discover', '-s', 'tests/python/native', '-p', 'test_offline_delivery.py'],
                  env={**os.environ, 'AUTOSAR_RECEIVER_PYTHON': receiver, 'AUTOSAR_RECEIVER_SAMPLES': 'standard-ecu user-application component-pipeline no-diagnostic'})
              print('::endgroup::', flush=True)
              if result.returncode:
                  print(f'::error title=Receiver Python {version}::The moved packages did not build and run with {receiver}', flush=True)
                  failed.append(version)
          sys.exit('Receiver Python failed: ' + ', '.join(failed) if failed else 0)

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    # checks.yml runs Linux and Windows on every pull request and push.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run lint --prefix ui
      - run: python -m autosar_tooling.ci_reporting run -- npm run test --prefix ui
      - run: npm run build --prefix ui
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
  official:
    needs: changes
    if: needs.changes.outputs.official == 'true'
    uses: ./.github/workflows/acceptance.yml
  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [project_import, definition_extension, cantp_receive, dcm_request]
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      # Bounded runs: a few minutes per target on pull requests, longer after merging.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 180 || 900 }}
      # The prebuilt cargo-fuzz defaults to the musl triple it was built for; ASan needs the glibc target.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/core-build-dependencies
      - name: Pinned nightly toolchain
        working-directory: fuzz
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      # The corpus grown by earlier master runs; committed seeds and reproducers stay read-only.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz with ASan and UBSan
        working-directory: fuzz
        run: |
          mkdir -p "../build/fuzz-corpus/$TARGET"
          inputs=("corpus/$TARGET")
          if [ -d "regressions/$TARGET" ]; then inputs+=("regressions/$TARGET"); fi
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "../build/fuzz-corpus/$TARGET" "${inputs[@]}" -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=60 -rss_limit_mb=4096 -print_final_stats=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      - name: Keep the smallest corpus with the same coverage
        if: github.event_name == 'push'
        working-directory: fuzz
        run: |
          mkdir -p "../build/fuzz-min/$TARGET"
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "../build/fuzz-min/$TARGET" "../build/fuzz-corpus/$TARGET" -- -set_cover_merge=1
          rm -rf "../build/fuzz-corpus/$TARGET"
          mv "../build/fuzz-min/$TARGET" "../build/fuzz-corpus/$TARGET"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
  result:
    name: Extended checks result
    needs: [changes, python, ui, desktop, official, receiver, fuzz]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys
          results = {name: need['result'] for name, need in json.loads(os.environ['RESULTS']).items()}
          print(results)
          # Skipped means the changed paths did not select the check.
          failed = {name: result for name, result in results.items() if result not in ('success', 'skipped') or name == 'changes' and result != 'success'}
          sys.exit('Extended checks did not pass: ' + str(failed) if failed else 0)
