name: Coverage reports
# Informational reports only; independent of Development checks and CI required.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'pages' || github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    if: github.ref == 'refs/heads/master'
    name: Rust default-test coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target
          key: coverage-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - name: Start an independent measurement
        run: cargo llvm-cov clean --workspace
      - name: Run workspace default tests with instrumentation
        run: cargo llvm-cov --locked --workspace --no-fail-fast --no-report
      - name: Render HTML
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html --output-dir build/coverage/rust
      - name: Export coverage data
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --json --output-path build/coverage/rust/coverage.json
      - name: Render the generator core report
        run: >-
          cargo llvm-cov report --ignore-filename-regex '(^|/)src-tauri/'
          --html --output-dir build/coverage/rust/core
      - name: Export generator core data
        run: >-
          cargo llvm-cov report --ignore-filename-regex '(^|/)src-tauri/'
          --json --output-path build/coverage/rust/core/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-rust-linux
          path: build/coverage/rust
          if-no-files-found: error
          retention-days: 14
  ui:
    if: github.ref == 'refs/heads/master'
    name: Vitest V8 coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run test:coverage --prefix ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-ui-linux
          path: build/coverage/ui
          if-no-files-found: error
          retention-days: 14
  python:
    if: github.ref == 'refs/heads/master'
    name: Python branch coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --group coverage
      - name: Run ordinary unittest suite
        run: uv run --locked --group coverage coverage run -m unittest discover -s tests/python
      - name: Render HTML
        if: ${{ !cancelled() }}
        run: uv run --locked --group coverage coverage html
      - name: Export coverage data
        if: ${{ !cancelled() }}
        run: uv run --locked --group coverage coverage json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-python-linux
          path: build/coverage/python
          if-no-files-found: error
          retention-days: 14
  c:
    name: Runtime and generated C coverage (Linux)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: gcc-13
      - run: uv run --locked --group coverage python -m autosar_tooling.c_coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-c-linux
          path: build/coverage/c
          if-no-files-found: error
          retention-days: 14
  diagrams:
    if: github.ref == 'refs/heads/master'
    env:
      PYTHONUTF8: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: archives
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - name: Download and verify official archives
        run: uv run --locked python -m autosar_tooling fetch-official
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.archives.outputs.cache-hit != 'true'
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - name: Draw the diagrams
        run: uv run --locked python -m autosar_tooling coverage --output diagrams
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-diagrams
          path: diagrams
          if-no-files-found: error
          retention-days: 1
  assemble-pages:
    needs: [c, rust, ui, python, diagrams]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*-linux
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: architecture-diagrams
          path: site
      - name: Assemble the reports and badges
        run: python3 scripts/publish_coverage.py reports site/coverage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  publish:
    needs: assemble-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
