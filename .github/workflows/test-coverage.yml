name: Coverage reports
# Informational reports only; independent of Development checks and CI required.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    name: Rust default-test coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: rustup component add llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target
          key: coverage-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - name: Start an independent measurement
        run: cargo llvm-cov clean --workspace
      - name: Run workspace default tests with instrumentation
        run: cargo llvm-cov --locked --workspace --no-fail-fast --no-report
      - name: Render HTML
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html --output-dir build/coverage/rust
      - name: Export coverage data
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --json --output-path build/coverage/rust/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-rust-linux
          path: build/coverage/rust
          if-no-files-found: error
          retention-days: 14
  ui:
    name: Vitest V8 coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run test:coverage --prefix ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-ui-linux
          path: build/coverage/ui
          if-no-files-found: error
          retention-days: 14
  python:
    name: Python branch coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --group coverage
      - name: Run ordinary unittest suite
        run: uv run --locked --group coverage coverage run -m unittest discover -s tests/python
      - name: Render HTML
        if: ${{ !cancelled() }}
        run: uv run --locked --group coverage coverage html
      - name: Export coverage data
        if: ${{ !cancelled() }}
        run: uv run --locked --group coverage coverage json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-python-linux
          path: build/coverage/python
          if-no-files-found: error
          retention-days: 14
