name: Native restart experiment
on:
  push:
    branches: [fix/host-task-restart-port]
    paths: [runtime/os/**, core/tests/fixtures/os/**, tests/python/native/os_suites.py, .github/workflows/port-experiment.yml]
permissions:
  contents: read
jobs:
  port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Actual native port and activation settlement
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_os_suites.py -k NativeSuiteTests.test_port_restart
      - name: Actual Task finish and FIFO contracts
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_os_suites.py -k NativeSuiteTests.test_finish
      - name: Actual physical stack and ARTI contracts
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_os_suites.py -k NativeSuiteTests.test_stack
