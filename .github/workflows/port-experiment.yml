name: Native stack capacity experiment
on:
  push:
    branches: [fix/host-task-restart-port]
    paths: [runtime/os/**, tests/fixtures/os_native_facilities.c, tests/python/native/test_host_boundaries.py, .github/workflows/port-experiment.yml]
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Actual configured execution-stack and hardware shadow-stack capacity
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py -k NativeFacilityTests
