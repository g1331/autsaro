name: Official archive comparison
# Runs the official test binary and the requirement disposition check (ADR 0017)
# against the licensed R24-11 archives, downloaded from autosar.org at run time and
# verified against core/resources/official.json.
# The archives stay in a private cache: never upload them or print their content.
# Not part of the required checks, so an unavailable site cannot block merging;
# extended.yml calls it when the archive-dependent paths it lists change.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  official:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: archives
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - name: Download and verify official archives
        id: fetch
        shell: bash
        run: |
          uv run --locked python -m autosar_tooling fetch-official || {
            echo "::error title=Official archives unavailable::Download, certificate or SHA-256 verification failed; the official tests did not run."
            exit 1
          }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.archives.outputs.cache-hit != 'true'
        with:
          path: docs/official/**/*.zip
          key: official-archives-${{ runner.os }}-${{ hashFiles('core/resources/official.json') }}
      - uses: ./.github/actions/core-build-dependencies
      - name: Select development interpreter
        run: uv run --locked python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('AUTOSAR_PYTHON=' + sys.executable + chr(10))"
      - name: Official comparison tests
        shell: bash
        run: |
          cargo test --locked -p autosar-config-core --features official-oracles --test official --no-fail-fast || {
            echo "::error title=Official comparison failed::The archives were verified; the official tests reported failures."
            exit 1
          }
      - name: Requirement dispositions
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        shell: bash
        env:
          # A completed module rework commits its catalog to core/resources/requirements and leaves
          # STALE_ONLY. Each catalog is checked completely and compared with the archive here; the
          # required checks account the same catalogs without the archive.
          # SWS_DefaultErrorTracer is added after #46 corrects its stale citation in docs/standards/det.md.
          STALE_ONLY: >-
            TR_Methodology TPS_SystemTemplate TPS_SoftwareComponentTemplate TPS_BSWModuleDescriptionTemplate
            TPS_ECUConfiguration SWS_StandardTypes SWS_PlatformTypes SWS_CommunicationStackTypes
            SWS_MemoryMapping SWS_RTE SWS_OS SWS_CANDriver
            SWS_CANTransportLayer SWS_DiagnosticCommunicationManager SWS_COMManager SWS_CANStateManager
            SWS_BSWModeManager
        run: |
          status=0
          for catalog in core/resources/requirements/*.json; do
            [ -e "$catalog" ] || continue
            uv run --locked python -m autosar_tooling requirements "$(basename "$catalog" .json)" || status=1
          done
          for document in $STALE_ONLY; do
            uv run --locked python -m autosar_tooling requirements --stale-only "$document" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=Requirement dispositions failed::See the undisposed items, stale citations and outdated catalogs above."
          fi
          exit "$status"
