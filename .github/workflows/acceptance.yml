name: Controlled resource and native acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [integration, native, all]
        default: integration
      platform:
        type: choice
        options: [Linux, Windows]
        default: Linux
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  acceptance:
    runs-on: [self-hosted, autosar-controlled, "${{ inputs.platform }}"]
    timeout-minutes: 180
    env:
      AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ github.workspace }}/acceptance-results/os
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Prepare result directory
        shell: bash
        run: mkdir -p acceptance-results
      - name: Select development interpreter
        run: uv run --locked python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('AUTOSAR_PYTHON=' + sys.executable + chr(10))"
      - name: Official integration
        if: inputs.suite == 'integration' || inputs.suite == 'all'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked cargo test --locked -p autosar-config-core --features official-oracles --no-fail-fast 2>&1 | tee acceptance-results/integration.log
      - name: Native process and ECU consumers
        if: inputs.suite == 'native' || inputs.suite == 'all'
        shell: bash
        run: |
          set -o pipefail
          uv run --locked cargo test --locked -p autosar-config-core --features native-tests --no-fail-fast 2>&1 | tee acceptance-results/native.log
      - name: Python native platform checks
        if: inputs.suite == 'native' || inputs.suite == 'all'
        shell: bash
        env:
          AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/acceptance-results/samples
        run: |
          set -o pipefail
          # The sealed build and receiver checks consume the generated samples.
          cargo test --locked -p autosar-config-core --test it -- 'c_analysis::'
          uv run --locked python -B -m unittest discover -s tests/python/native 2>&1 | tee acceptance-results/python-native.log
      - name: UI installation
        if: inputs.suite == 'all'
        run: npm ci --prefix ui
      - name: UI build
        if: inputs.suite == 'all'
        run: npm run build --prefix ui
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: acceptance-${{ inputs.platform }}-${{ github.sha }}
          path: acceptance-results
          if-no-files-found: ignore
