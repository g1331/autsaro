  c-analysis-samples:
    permissions:
      contents: read
      actions: read
      security-events: write
    needs: c-analysis-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: user-application
            samples: user-application
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: component-pipeline
            samples: component-pipeline
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: no-diagnostic
            samples: no-diagnostic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ANALYSIS_SIDE: current
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-sample-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - name: Verify complete generated-project analysis
        id: analyze
        shell: python
        env:
          ANALYSIS_SIDE: ${{ env.ANALYSIS_SIDE }}
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLES: ${{ matrix.samples }}
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          failed = False
          baseline = os.environ['ANALYSIS_SIDE'] == 'baseline'
          samples = Path('build/c-analysis-base-samples' if baseline else 'build/c-analysis-samples')
          results = Path('build/c-analysis-baseline' if baseline else 'build/c-analysis-results')
          expected = set(os.environ['ANALYSIS_SAMPLES'].split(','))
          for name in sorted(expected):
              output = results / name
              result = subprocess.run(['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling',
                  'c-check', '--target', os.environ['ANALYSIS_TARGET'], '--project', str(samples / name),
                  '--output-directory', str(output)])
              try:
                  summary = json.loads((output / 'summary.json').read_text(encoding='utf-8'))
                  complete = (summary['error'] is None and result.returncode == (0 if summary['passed'] else 1)
                      and summary['projectAcceptance']['status'] in ('accepted', 'blocked'))
                  print(name, 'analysis_complete=' + str(complete), 'source_passed=' + str(summary['passed']))
                  failed = not complete or failed
              except (OSError, ValueError, KeyError) as error:
                  print(name, error)
                  failed = True
          sys.exit(1 if failed else 0)
      # Independent tool tests run once per platform, alongside the other sample shards.
      - name: Analyzer behavior tests
        if: env.ANALYSIS_SIDE == 'current' && matrix.group == 'no-diagnostic'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_c_analysis.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: c-analysis-raw-${{ env.ANALYSIS_SIDE }}-${{ matrix.target }}-${{ matrix.group }}-${{ strategy.job-index }}
          overwrite: true
          path: |
            build/${{ env.ANALYSIS_SIDE == 'baseline' && 'c-analysis-baseline' || 'c-analysis-results' }}/*/summary.json
            build/${{ env.ANALYSIS_SIDE == 'baseline' && 'c-analysis-baseline' || 'c-analysis-results' }}/*/project
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # Full target-host replay inputs are retained once, outside the comparison bundle.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: c-analysis-${{ env.ANALYSIS_SIDE == 'baseline' && 'baseline-' || '' }}${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: build/${{ env.ANALYSIS_SIDE == 'baseline' && 'c-analysis-baseline' || 'c-analysis-results' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

