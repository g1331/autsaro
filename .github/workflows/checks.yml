name: Development checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base:
        description: Incremental check baseline commit
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
env:
  PYTHONUTF8: '1'
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # Pull requests touching only reader documentation and design records
      # skip build and test jobs; pushes and manual runs always check everything.
      - id: detect
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          import os, subprocess
          documentation = ('docs/', '.agents/', '.claude/', '.impeccable/', '.github/ISSUE_TEMPLATE/')
          def is_documentation(path):
              if path.startswith(documentation) or path in {'LICENSE', 'NOTICE', '.github/PULL_REQUEST_TEMPLATE.md'}:
                  return True
              # Root guides only; nested Markdown such as runtime/README.md ships with generated projects.
              return '/' not in path and path.endswith('.md')
          code = True
          if os.environ['PULL_REQUEST']:
              listing = subprocess.run(['gh', 'api', '--paginate', '--jq', '.[].filename',
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PULL_REQUEST']}/files"],
                  check=True, capture_output=True, text=True).stdout.split()
              # The files API stops at 3000 entries; treat a truncated listing as code.
              code = not listing or len(listing) >= 3000 or not all(map(is_documentation, listing))
              print('\n'.join(listing))
          print('code=' + str(code).lower())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('code=' + str(code).lower() + '\n')
  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run lint --prefix ui
      - run: npm run test --prefix ui
      - run: npm run build --prefix ui
  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tools tests/python scripts
      - run: uv run --locked python -B -m unittest discover -s tests/python
      - run: uv build --out-dir build/python
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: build/python
          if-no-files-found: ignore
  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/core-build-dependencies
      - run: cargo test --locked -p autosar-config-core
      # Lint every feature, including the native and official test binaries that only manual
      # acceptance runs. core/clippy.toml and module attributes add the generation rules.
      - run: cargo clippy --locked -p autosar-config-core --all-targets --all-features -- -D warnings
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo test --locked -p autosar-config-desktop
      - run: cargo build --locked -p autosar-config-desktop
      - if: runner.os == 'Linux'
        run: cargo clippy --locked -p autosar-config-desktop --all-targets -- -D warnings
  process:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s tests/python/process
  native:
    # Native suites that need GCC but no licensed archive; the rest stay in acceptance.yml.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the slowest suites on a second runner; Linux keeps one job.
        include:
          - os: ubuntu-24.04
            shard: all
          - os: windows-latest
            shard: slow
          - os: windows-latest
            shard: rest
    name: native (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      # One name list selects the slow shard and is skipped by the rest, so every test runs
      # exactly once; a renamed module only moves its tests to "rest".
      - name: Native library and contract suites
        shell: python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          import os, subprocess, sys
          slow = ['integration::sealed_projects', 'integration::single_component', 'integration::protocol']
          filters = {'all': [], 'slow': slow, 'rest': [arg for name in slow for arg in ('--skip', name)]}[os.environ['SHARD']]
          sys.exit(subprocess.run(['cargo', 'test', '--locked', '-p', 'autosar-config-core', '--features', 'native-tests',
              '--lib', '--test', 'native', '--no-fail-fast', '--', *filters]).returncode)
  native-os:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows splits the serial suites over two runners; each suite still runs alone.
        include:
          - os: ubuntu-24.04
            shard: 0/1
          - os: windows-latest
            shard: 0/2
          - os: windows-latest
            shard: 1/2
    name: native-os (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Native OS conformance suites
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
          AUTOSAR_OS_SHARD: ${{ matrix.shard }}
        run: uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: os-suites-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/os-suites
          if-no-files-found: ignore
          retention-days: 14
      - name: Host I/O and lock failure boundaries
        if: startsWith(matrix.shard, '0/')
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py
  native-sanitizers:
    # GCC sanitizers over the directly compiled native programs and the OS suites (#129).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        sanitize: [thread, 'address,undefined']
    name: native-sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTOSAR_SANITIZE: ${{ matrix.sanitize }}
      # The OS host owns its alternate signal stack and switches stacks with ucontext.
      ASAN_OPTIONS: use_sigaltstack=0:detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      # ECU builds go through the pinned delivery tool and stay uninstrumented, so only
      # modules that compile their programs directly run here. setarch -R disables ASLR,
      # which GCC 13's ThreadSanitizer needs under the runner's vm.mmap_rnd_bits.
      - name: Instrumented native programs
        run: >-
          setarch x86_64 -R cargo test --locked -p autosar-config-core --features native-tests --test native
          --no-fail-fast -- 'runtime_contracts::' 'host::' 'integration::generated_c::'
          'integration::os::counter_header_oracles' 'sanitizers::'
      # ThreadSanitizer defers asynchronous signal handlers to its own safe points, so the
      # FreeRTOS POSIX port cannot suspend actors with SIGRTMIN; the OS suites run under ASan.
      - name: Instrumented OS suites
        if: matrix.sanitize != 'thread'
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
        run: setarch x86_64 -R uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: os-suites-sanitizer-${{ strategy.job-index }}
          path: ${{ runner.temp }}/os-suites
          if-no-files-found: ignore
          retention-days: 14
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - run: uv sync --locked
      - run: npm ci --prefix ui
      - name: Select baseline
        shell: python
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          import os, subprocess
          base = os.environ['BASE_REVISION']
          if base and set(base) == {'0'}:
              base = subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '--stdin'], input=b'').decode().strip()
          else:
              subprocess.run(['git', 'rev-parse', '--verify', base + '^{commit}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CHECK_BASE=' + base + '\n')
      - run: uv run --locked python -m autosar_tooling quality --scope all --base "${{ env.CHECK_BASE }}"
      # Accounts each committed catalog in core/resources/requirements (ADR 0017) without the archive.
      - name: Requirement dispositions
        run: uv run --locked python -m autosar_tooling requirements

  c-analysis-prepare:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
          - os: windows-latest
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Identify native build cache inputs
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: build-essential cmake
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/checkout@v7.0.1
        with:
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b
          path: build/cppcheck-source
      - name: Preserve pinned addon bytes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          source = Path('build/cppcheck-source')
          for name in ['misra.py', 'cppcheckdata.py', 'misra_9.py']:
              data = subprocess.check_output(['git', '-C', str(source), 'show', 'HEAD:addons/' + name])
              (source / 'addons' / name).write_bytes(data)
      - uses: actions/cache@v6.1.0
        id: cppcheck-cache
        with:
          path: build/c-analysis-tools
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_IMAGE }}-e73bf44c3e49686b7495fab352d03a6c6075516b-v1
      - name: Configure pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake -S build/cppcheck-source -B build/cppcheck-build -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=OFF -DBUILD_GUI=OFF -DBUILD_TESTING=OFF
      - name: Build pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake --build build/cppcheck-build --config Release --target cppcheck --parallel 2
      - name: Package analyzer
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          bundle = Path('build/c-analysis-tools')
          binaries = list(Path('build/cppcheck-build/bin').rglob('cppcheck.exe' if os.name == 'nt' else 'cppcheck'))
          if len(binaries) != 1:
              raise RuntimeError('Expected one built analyzer')
          bundle.mkdir()
          shutil.copy2(binaries[0], bundle / binaries[0].name)
          for name in ('addons', 'cfg'):
              shutil.copytree(Path('build/cppcheck-source') / name, bundle / name)
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-v1
      - name: Analyzer behavior tests
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_c_analysis.py
      - name: Generate complete analysis samples
        run: cargo test --locked -p autosar-config-core --test it -- 'c_analysis::'
      - name: Validate generated sample inventory
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          if {p.name for p in Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES']).iterdir()} != expected:
              raise RuntimeError('Generated sample inventory is incomplete')
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          overwrite: true
          path: |
            build/c-analysis-tools
            build/c-analysis-samples
          if-no-files-found: error
          retention-days: 14
      # After publishing, so a format failure still leaves the samples for diagnosis.
      - name: Generated C follows .clang-format
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_generated_format.py
      - name: Generated C compiles with clang warnings
        if: runner.os == 'Linux'
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_clang_build.py

  native-delivery:
    # Builds and receives the prepared samples; runs beside their analysis rather than before it.
    needs: c-analysis-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
          - os: windows-latest
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/download-artifact@v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      # The sealed build and receiver checks resolve the same absolute tools.
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Sealed ECU build mode fault isolation
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_ecu_build_modes.py
      # The generated CMake build (uv-locked CMake and Ninja) compiles the target.json closure.
      - name: CMake build matches the sealed ECU build
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_cmake_build.py
      # Every supported receiver interpreter runs the moved package; a failing version does not hide the others.
      - name: Moved package verifies with receiver Python 3.11–3.14
        shell: python
        run: |
          import os, subprocess, sys
          failed = []
          for version in ('3.11', '3.12', '3.13', '3.14'):
              subprocess.run(['uv', 'python', 'install', '--no-bin', version], check=True)
              receiver = subprocess.check_output(['uv', 'python', 'find', '--no-project', '--managed-python', version], text=True).strip()
              print(f'::group::Receiver Python {version}: {receiver}', flush=True)
              result = subprocess.run(['uv', 'run', '--locked', 'python', '-B', '-m', 'unittest', 'discover', '-s', 'tests/python/native', '-p', 'test_offline_delivery.py'],
                  env={**os.environ, 'AUTOSAR_RECEIVER_PYTHON': receiver})
              print('::endgroup::', flush=True)
              if result.returncode:
                  print(f'::error title=Receiver Python {version}::The moved package did not verify with {receiver}', flush=True)
                  failed.append(version)
          sys.exit('Receiver Python failed: ' + ', '.join(failed) if failed else 0)

  c-analysis-samples:
    needs: c-analysis-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: user-application
            samples: user-application
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: component-pipeline
            samples: component-pipeline
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: no-diagnostic
            samples: no-diagnostic
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: user-application
            samples: user-application
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: component-pipeline
            samples: component-pipeline
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: no-diagnostic
            samples: no-diagnostic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/download-artifact@v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - name: Verify complete generated-project analysis
        shell: python
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLES: ${{ matrix.samples }}
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          failed = False
          samples = Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES'])
          expected = set(os.environ['ANALYSIS_SAMPLES'].split(','))
          for name in sorted(expected):
              output = Path('build/c-analysis-results') / name
              result = subprocess.run(['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling',
                  'c-check', '--target', os.environ['ANALYSIS_TARGET'], '--project', str(samples / name),
                  '--output-directory', str(output)])
              try:
                  summary = json.loads((output / 'summary.json').read_text(encoding='utf-8'))
                  complete = summary['error'] is None and result.returncode == (0 if summary['passed'] else 1)
                  print(name, 'analysis_complete=' + str(complete), 'source_passed=' + str(summary['passed']))
                  failed = not complete or failed
              except (OSError, ValueError, KeyError) as error:
                  print(name, error)
                  failed = True
          sys.exit(1 if failed else 0)
      # Existing source remediation precedes automatic strict source gating.
      # Readiness above verifies complete analysis; it does not approve violations.
      - name: Strict generated source gate
        if: github.event_name == 'workflow_dispatch'
        shell: python
        env:
          ANALYSIS_SAMPLES: ${{ matrix.samples }}
        run: |
          import json, os, sys
          from pathlib import Path
          summaries = list(Path('build/c-analysis-results').glob('*/summary.json'))
          passed = len(summaries) == len(os.environ['ANALYSIS_SAMPLES'].split(',')) and all(json.loads(p.read_text(encoding='utf-8'))['passed'] for p in summaries)
          sys.exit(0 if passed else 1)
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: c-analysis-summaries-${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: build/c-analysis-results/*/summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: c-analysis-${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: build/c-analysis-results
          if-no-files-found: ignore
          retention-days: 14

  c-analysis:
    # A skipped/cancelled producer or shard must never make the gate green.
    needs: [changes, c-analysis-prepare, c-analysis-samples]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: c-analysis-summaries-*
          path: build/c-analysis-summaries
      - name: Require every platform and sample group
        env:
          PREPARE_RESULT: ${{ needs.c-analysis-prepare.result }}
          ANALYSIS_RESULT: ${{ needs.c-analysis-samples.result }}
        run: test "$PREPARE_RESULT" = success && test "$ANALYSIS_RESULT" = success
      - name: Require eight complete sample results
        shell: python
        run: |
          import json
          from pathlib import Path
          targets = {'linux-x64-controlled-v1', 'windows-x64-controlled-v1'}
          samples = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          expected = {(target, sample) for target in targets for sample in samples}
          found = set()
          for path in Path('build/c-analysis-summaries').glob('*/*/summary.json'):
              summary = json.loads(path.read_text(encoding='utf-8'))
              pair = (summary['scope']['target'], path.parent.name)
              if pair in found or summary['error'] is not None:
                  raise RuntimeError('Duplicate or incomplete analysis result: ' + str(path))
              found.add(pair)
          if found != expected:
              raise RuntimeError('Expected all eight platform/sample results; missing=' + str(expected - found) + '; extra=' + str(found - expected))

  required:
    # The only status check branch rules require; the list of blocking jobs lives here.
    name: CI required
    needs: [changes, ui, python, core, desktop, process, native, native-os, native-sanitizers, native-delivery, quality, c-analysis]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking job
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          code = needs['changes']['outputs'].get('code') == 'true'
          # Skips are accepted only for documentation-only pull requests.
          accepted = {'success'} if code or needs['changes']['result'] != 'success' else {'success', 'skipped'}
          failed = {name: need['result'] for name, need in needs.items()
                    if need['result'] not in (accepted if name != 'changes' else {'success'})}
          print('code=' + str(code).lower(), {name: need['result'] for name, need in needs.items()})
          sys.exit('Blocking jobs did not pass: ' + str(failed) if failed else 0)
