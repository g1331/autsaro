    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ANALYSIS_SIDE: baseline
      ANALYSIS_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CURRENT_INPUTS: build/c-analysis-current-inputs
      PYTHONPATH: ${{ github.workspace }}/build/c-analysis-current-inputs/tools/python/src
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-base-samples
    steps: *analysis-generate-steps

  native-delivery:
    # Builds and receives the prepared samples; runs beside their analysis rather than before it.
    needs: [changes, c-analysis-generate]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows builds take about three times longer, so its receiver runs on a second runner.
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            part: all
    name: native-delivery (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &native-delivery-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Collect Windows native crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: *windows-local-dumps
      - name: Start Windows process lifecycle trace
        if: runner.os == 'Windows'
        shell: python
        run: *windows-job-trace-start
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      # The sealed build and receiver checks resolve the same absolute tools.
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Sealed ECU build mode fault isolation
        if: matrix.part != 'receiver'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_ecu_build_modes.py
      # The generated CMake build (uv-locked CMake and Ninja) compiles the target.json closure.
      - name: CMake build matches the sealed ECU build
        if: matrix.part != 'receiver'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_cmake_build.py
      # Oldest supported receiver runs every sample; Extended covers the full interpreter matrix.
      - name: All moved samples build and run with receiver Python 3.11
        if: matrix.part != 'builds'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run(['uv', 'python', 'install', '--no-bin', '3.11'], check=True)
          receiver = subprocess.check_output(['uv', 'python', 'find', '--no-project', '--managed-python', '3.11'], text=True).strip()
          print(f'Receiver Python 3.11: {receiver}', flush=True)
          result = subprocess.run(['python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', 'uv', 'run', '--locked', 'python', '-B', '-m', 'unittest', 'discover', '-s', 'tests/python/native', '-p', 'test_offline_delivery.py'],
              env={**os.environ, 'AUTOSAR_RECEIVER_PYTHON': receiver,
                   'AUTOSAR_RECEIVER_SAMPLES': 'standard-ecu user-application component-pipeline no-diagnostic'})
          if result.returncode:
              print(f'::error title=Receiver Python 3.11::The moved packages did not build and run with {receiver}', flush=True)
          sys.exit(result.returncode)


      - name: Stop Windows process lifecycle trace
        if: always() && runner.os == 'Windows'
        timeout-minutes: 5
        shell: python
        run: *windows-job-trace-stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        timeout-minutes: 2
        with:
          name: delivery-crash-dumps-${{ matrix.os }}-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/native-crash-dumps
            ${{ runner.temp }}/windows-job-evidence
          if-no-files-found: ignore
          retention-days: 14

  native-delivery-windows:
    # Builds and receives the prepared samples; runs beside their analysis rather than before it.
    needs: [changes, c-analysis-generate-windows]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows builds take about three times longer, so its receiver runs on a second runner.
        include:
          - os: windows-2025-vs2026
            target: windows-x64-controlled-v1
            part: builds
          - os: windows-2025-vs2026
            target: windows-x64-controlled-v1
            part: receiver
    name: native-delivery (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: *native-delivery-steps

  c-analysis-samples:
    name: c-analysis-samples (${{ matrix.target }}, ${{ matrix.first }} + ${{ matrix.second }})
    permissions:
      contents: read
      actions: read
    needs: [c-analysis-prepare, c-analysis-generate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            first: standard-ecu
            second: user-application
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            first: component-pipeline
            second: no-diagnostic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ANALYSIS_SIDE: current
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-sample-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.release-revision || github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Install pinned Linux UAPI headers
        id: linux-uapi-headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Separate runners must compare the same searchable linux-libc-dev headers.
          archive=$(mktemp --suffix=.deb)
          trap 'rm -f -- "$archive"' EXIT
          curl --fail --silent --show-error --location --output "$archive" \
            https://snapshot.ubuntu.com/ubuntu/20261126T000000Z/pool/main/l/linux/linux-libc-dev_6.8.0-151.151_amd64.deb
          # SHA-256 from the signed noble-security package index in this snapshot.
          printf '%s  %s\n' badd744a9dc7e43c53975ac08d88e23dd13223f2334637c25fd9b9e9bb5d236d "$archive" | sha256sum --check --strict
          sudo dpkg --install "$archive"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-analysis-tools-${{ matrix.target }}
          path: build/c-analysis-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-analysis-${{ env.ANALYSIS_SIDE == 'baseline' && 'base-inputs' || 'inputs' }}-${{ matrix.target }}
          path: build
      - name: Require generated tree identity
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          receipt = json.loads(Path('build/c-analysis-generation.json').read_text())
          side = os.environ['ANALYSIS_SIDE']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^1' if side == 'baseline' else 'HEAD'], text=True).strip()
          if receipt != {'tree': tree, 'side': side, 'target': os.environ['ANALYSIS_TARGET']}:
              raise RuntimeError('Generated analysis tree identity differs')
      - name: Use first-parent production for baseline assessment
        if: env.ANALYSIS_SIDE == 'baseline'
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
        # This is a disposable raw-job checkout; PR tools, inputs and records stay current.
        shell: python
        run: |
          import os, subprocess
          from autosar_tooling.c_acceptance import BASELINE_PRODUCTION
          native = 'true' if os.environ['ANALYSIS_TARGET'].startswith('windows') else 'false'
          eol = 'crlf' if native == 'true' else 'lf'
          subprocess.run(['git', '-c', 'core.autocrlf=' + native, '-c', 'core.eol=' + eol,
              'restore', '--source',
              'HEAD^1', '--worktree', '--', *BASELINE_PRODUCTION], check=True)
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - name: Verify complete generated-project analysis
        id: analyze
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_SIDE: ${{ env.ANALYSIS_SIDE }}
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLES: ${{ matrix.first }},${{ matrix.second }}
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          baseline = os.environ['ANALYSIS_SIDE'] == 'baseline'
          samples = Path('build/c-analysis-base-samples' if baseline else 'build/c-analysis-samples')
          expected = os.environ['ANALYSIS_SAMPLES'].split(',')
          if len(expected) != len(set(expected)):
              raise RuntimeError('Duplicated analysis sample configuration')
          def scan(name):
              # The artifact root contains exactly this sample, including on failure.
              output = Path('build/analysis-output') / name / name
              result = subprocess.run(['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling.c_baseline',
                  '--side', os.environ['ANALYSIS_SIDE'], '--sample', name,
                  '--target', os.environ['ANALYSIS_TARGET'], '--project', str(samples / name),
                  '--output-directory', str(output), '--fingerprints'])
              try:
                  summary = json.loads((output / 'summary.json').read_text(encoding='utf-8'))
                  evidence = summary.get('preprocessingEvidence', {})
                  trace = output / 'preprocessing.json.gz'
                  trace_matches = (baseline or (evidence.get('file') == trace.name and trace.is_file()
                      and hashlib.sha256(trace.read_bytes()).hexdigest() == evidence.get('sha256')))
                  complete = (summary['error'] is None and result.returncode == 0
                      and summary['projectAcceptance']['status'] in ('accepted', 'blocked')
                      and trace_matches)
                  if not baseline:
                      print(name, 'preprocessingEvidence=' + json.dumps(evidence, ensure_ascii=False))
                  print(name, 'analysis_complete=' + str(complete), 'source_passed=' + str(summary['passed']))
                  return complete
              except (OSError, ValueError, KeyError) as error:
                  print(name, error)
                  return False
          with ThreadPoolExecutor(max_workers=2) as workers:
              completed = list(workers.map(scan, expected))
          sys.exit(0 if all(completed) else 1)
      - uses: ./.github/actions/retain-analysis-sample
        if: always()
        with:
          target: ${{ matrix.target }}
          side: ${{ env.ANALYSIS_SIDE }}
          sample: ${{ matrix.first }}
          index: ${{ strategy.job-index }}

      - uses: ./.github/actions/retain-analysis-sample
        if: always()
        with:
          target: ${{ matrix.target }}
          side: ${{ env.ANALYSIS_SIDE }}
          sample: ${{ matrix.second }}
          index: ${{ strategy.job-index }}

