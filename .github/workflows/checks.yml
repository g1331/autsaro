name: Development checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base:
        description: Incremental check baseline commit
        required: true
  workflow_call:
    inputs:
      release-revision:
        description: Exact commit selected for packaging
        type: string
        required: true
# Keep the non-required tail from locking another master revision.
# Isolate title-only edits and unrelated labels from the active PR run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      ((github.event.action == 'labeled' && github.event.label.name != 'full-ci') ||
       (github.event.action == 'edited' && github.event.changes.title &&
        !github.event.changes.body && !github.event.changes.base))
      && github.run_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
        !(github.event.action == 'edited' && github.event.changes.title &&
          !github.event.changes.body && !github.event.changes.base) }}
permissions:
  contents: read
  pull-requests: read
env:
  PYTHONUTF8: '1'
  PYTHONPATH: tools/python/src
jobs:
  changes:
    name: Detect changed areas
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      !(github.event.action == 'edited' && github.event.changes.title &&
        !github.event.changes.body && !github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      native: ${{ steps.detect.outputs.native }}
      desktop: ${{ steps.detect.outputs.desktop }}
      analysis: ${{ steps.detect.outputs.analysis }}
      application: ${{ steps.detect.outputs.application }}
      source-parent: ${{ steps.detect.outputs.source-parent }}
    steps:
      # Select against the checked-out merge revision even if the PR receives another push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release-revision || github.sha }}
      - id: detect
        shell: python
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          BASE: ${{ github.event.before }}
          RELEASE_REVISION: ${{ inputs.release-revision }}
        run: |
          import os, subprocess
          from autosar_tooling.ci_selection import git_diff_rows, select_changes
          rows = None
          if os.environ['PULL_REQUEST']:
              diff = subprocess.run(['git', 'diff', '--find-renames', '--name-status', '-z',
                  'HEAD^1', 'HEAD', '--'], stdout=subprocess.PIPE)
              if diff.returncode == 0:
                  rows = git_diff_rows(diff.stdout)
          elif os.environ.get('BASE') and set(os.environ['BASE']) != {'0'}:
              diff = subprocess.run(['git', 'diff', '--no-renames', '--name-only',
                  os.environ['BASE'], os.environ['GITHUB_SHA']], capture_output=True, text=True)
              if diff.returncode == 0:
                  rows = [dict(filename=path, status='modified') for path in diff.stdout.split()]
          if rows is not None:
              for row in rows:
                  print(row)
          values = select_changes(rows, pull_request=bool(os.environ['PULL_REQUEST']))
          # Keep every heavy consumer unselected until the PR is ready for review.
          if os.environ.get('RELEASE_REVISION'):
              values = dict.fromkeys(values, False)
              values['analysis'] = True
          elif os.environ.get('DRAFT') == 'true':
              values = dict.fromkeys(values, False)
          print(values)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              if values['analysis']:
                  parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^1'], text=True).strip()
                  output.write('source-parent=' + parent + '\n')
              for key, value in values.items():
                  output.write(key + '=' + str(value).lower() + '\n')

  desktop-scenarios:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/master' ||
       needs.changes.outputs.desktop == 'true')
    uses: ./.github/workflows/desktop.yml
  python:
    # Short checks follow preparation so long native jobs can claim the first runners.
    needs: [changes, c-analysis-generate, c-analysis-generate-windows]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest on Linux, newest on Windows; extended.yml runs the rest of the
        # matrix after merging. native-delivery runs all samples on receiver 3.11 only;
        # these Python jobs cover newer ecu_tools interpreters, Extended the full receiver matrix.
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-2025-vs2026
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tools tests/python scripts
      - run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python
      - name: Show link and junction test outcomes
        if: runner.os == 'Windows'
        run: uv run --locked python -B -m unittest discover -v -s tests/python -k link
      # Managed process tests once per platform, without a runner of their own.
      - name: Managed process tests
        if: matrix.python == '3.12' || runner.os == 'Windows'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/process
      - run: uv build --out-dir build/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: build/python
          if-no-files-found: ignore
  core:
    # The shared tools finish early; keep the first batch within 20 hosted jobs.
    needs: [changes, c-analysis-prepare]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/core-build-dependencies
      - run: python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core
      - name: Runtime build identities and dependency pinning
        env:
          PYTHONPATH: tools/python/src
        run: python3 -B -m unittest discover -s tests/python/native -p test_asset_build.py
      # Lint every feature, including the native and official test binaries that only manual
      # acceptance runs. core/clippy.toml and module attributes add the generation rules.
      - run: cargo clippy --locked -p autosar-config-core --all-targets --all-features -- -D warnings
      # The committed fuzz corpus and reproducers replay as ordinary tests; fuzzing itself runs
      # in extended.yml with the pinned nightly (docs/development/testing/fuzzing.md).
      - run: python -m autosar_tooling.ci_reporting run -- cargo test --locked --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
  desktop:
    # Desktop checks build from checkout and have no generated-sample inputs.
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Identify installed desktop build dependencies
        if: ${{ !cancelled() && success() && runner.os == 'Windows' }}
        id: desktop-cache-inputs
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          from time import perf_counter

          def files_under(directory):
              def fail(error):
                  raise error
              return [Path(parent) / name for parent, _, names in os.walk(directory, onerror=fail)
                      for name in names]

          def optional_entries(directory):
              try:
                  return list(directory.iterdir())
              except FileNotFoundError:
                  return []

          started = perf_counter()
          native = hashlib.sha256()
          root = Path(os.environ['VCPKG_ROOT'])
          installed = root / 'installed'
          triplet = os.environ['VCPKGRS_TRIPLET']
          metadata = installed / 'vcpkg'
          files = [*files_under(installed / triplet), *files_under(metadata / 'info'),
                   *files_under(metadata / 'updates')]
          files.extend(path for path in metadata.iterdir() if path.name == 'status')
          # vcpkg-rs can read staged pkg-config metadata to order libraries within a port.
          for port in optional_entries(root / 'packages'):
              if port.name.endswith('_' + triplet):
                  files.extend(path for path in optional_entries(port / 'lib/pkgconfig')
                               if path.suffix == '.pc')
          for path in sorted(files):
              native.update(os.fsencode(path.relative_to(root).as_posix()) + b'\0')
              with path.open('rb') as content:
                  native.update(hashlib.file_digest(content, 'sha256').digest())
          print(f'Hashed {len(files)} native dependency files in {perf_counter() - started:.3f}s')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('image=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
              output.write('native=' + native.hexdigest() + '\n')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: desktop-dependencies
        if: runner.os == 'Windows' && steps.desktop-cache-inputs.outputs.image != '' && steps.desktop-cache-inputs.outputs.native != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: >-
            ${{ format('desktop-dev-deps-v4-{0}-{1}-{2}-{3}-{4}', runner.os, runner.arch,
            steps.desktop-cache-inputs.outputs.image, steps.desktop-cache-inputs.outputs.native,
            hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'core/Cargo.toml',
            'src-tauri/Cargo.toml', '.github/actions/core-build-dependencies/action.yml')) }}
      - name: Invalidate cached native probes and objects
        id: refresh-native-probes
        if: ${{ !cancelled() && success() && runner.os == 'Windows' }}
        shell: python
        run: |
          import json, subprocess

          host = subprocess.check_output(['rustc', '--print', 'host-tuple'], text=True).strip()
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--format-version', '1', '--filter-platform', host]))
          native_build_dependencies = {'pkg-config', 'system-deps', 'vcpkg', 'cc'}
          packages = sorted({package['name'] for package in metadata['packages']
                            if any(dep['kind'] == 'build' and dep['name'] in native_build_dependencies
                                   for dep in package['dependencies'])})
          if not packages:
              raise RuntimeError('No Cargo packages using native library probes')
          print(f'Rebuilding {len(packages)} packages with native build dependencies: ' + ', '.join(packages), flush=True)
          command = ['cargo', 'clean', '--locked', '--profile', 'dev']
          for package in packages:
              command.extend(('-p', package))
          subprocess.run(command, check=True)
      - if: ${{ !cancelled() }}
        run: npm ci --prefix ui
      - if: ${{ !cancelled() }}
        run: npm run lint --prefix ui
      - if: ${{ !cancelled() }}
        run: python -m autosar_tooling.ci_reporting run -- npm run test --prefix ui
      - if: ${{ !cancelled() }}
        run: npm run build --prefix ui
      # Desktop tests are compile-bound: the dev profile keeps the GUI dependencies unoptimized
      # and shared with the build below.
      - if: ${{ !cancelled() && (runner.os != 'Windows' || steps.refresh-native-probes.outcome == 'success') }}
        run: python -m autosar_tooling.ci_reporting run -- cargo test --locked --profile dev -p autosar-config-desktop
      - if: ${{ !cancelled() && (runner.os != 'Windows' || steps.refresh-native-probes.outcome == 'success') }}
        run: npm run ipc:check --prefix ui
      - if: ${{ !cancelled() && (runner.os != 'Windows' || steps.refresh-native-probes.outcome == 'success') }}
        run: cargo build --locked -p autosar-config-desktop
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo clippy --locked -p autosar-config-desktop --all-targets -- -D warnings
      # Store dependency objects only. Each run builds and checks both workspace crates.
      - name: Remove workspace objects before saving desktop dependencies
        if: ${{ !cancelled() && success() && runner.os == 'Windows' && steps.desktop-dependencies.outcome == 'success' && steps.desktop-dependencies.outputs.cache-hit != 'true' }}
        run: cargo clean --locked --workspace --profile dev
  native:
    # Native suites that need GCC but no licensed archive; the rest stay in acceptance.yml.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shard: all
    name: native (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: &native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: gdb
      - uses: ./.github/actions/native-analysis-compiler
      # https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
      - name: Collect Windows native crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: &windows-local-dumps |
          $folder = Join-Path $env:RUNNER_TEMP 'native-crash-dumps'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $folder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
      - name: Start Windows process lifecycle trace
        if: runner.os == 'Windows'
        shell: python
        run: &windows-job-trace-start |
          import os
          from pathlib import Path
          from autosar_tooling.windows_etw import start
          root = Path(os.environ['RUNNER_TEMP']) / 'windows-job-evidence'
          start(root / 'etw')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('AUTOSAR_JOB_EVIDENCE_DIRECTORY=' + str(root / 'job-evidence') + '\n')
      - name: Identify native build cache inputs
        shell: python
        run: &cargo-source-digest |
          import hashlib, os, subprocess
          from pathlib import Path
          # Only tracked inputs participate, even after imports/builds create new files.
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--',
              'core', 'runtime', 'third_party/freertos', 'tools/python/src/ecu_tools', 'LICENSE', 'NOTICE'])
          digest = hashlib.sha256()
          tracked = sorted(path for path in paths.split(b'\0') if path)
          for path in tracked:
              digest.update(path + b'\0')
              digest.update(hashlib.sha256(Path(os.fsdecode(path)).read_bytes()).digest())
          source = digest.hexdigest()
          print(f'Cargo source digest: {source} ({len(tracked)} tracked inputs)', flush=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
              output.write('CACHE_SOURCE=' + source + '\n')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-${{ env.CACHE_SOURCE }}
          # Prefer refreshed source snapshots before the legacy exact key.
          restore-keys: |
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Windows nested Job evidence controls
        if: runner.os == 'Windows' && matrix.shard == 'rest'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -v -s tests/python/process -k test_windows_
      # One classifier partitions exact test names; the complement includes new modules.
      - name: Native library and contract suites
        shell: python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          groups = {
              'protocol': ['integration::protocol::', 'integration::release_contracts::'],
              'projects': ['integration::sealed_projects::', 'integration::single_component::'],
              'integration': ['integration::'],
              'rest': [],
          }
          shard = os.environ['SHARD']
          command = ['cargo', 'test', '--locked', '-p', 'autosar-config-core', '--features', 'native-tests',
              '--lib', '--test', 'native', '--no-fail-fast', '--']
          filters = []
          if shard != 'all':
              # A measured long tail belongs with the smaller complement, independently of its module.
              outlier = ('integration::single_component::'
                  'short_application_period_saves_builds_and_passes_reference_verifier')
              def assigned(name):
                  if name == outlier:
                      return 'rest'
                  return next((group for group, prefixes in groups.items()
                      if any(name.startswith(prefix) for prefix in prefixes)), 'rest')
              listing = subprocess.run([*command, '--list'], capture_output=True, text=True)
              print(listing.stdout, end='', flush=True)
              print(listing.stderr, end='', file=sys.stderr, flush=True)
              if listing.returncode:
                  sys.exit(listing.returncode)
              names = {line.removesuffix(': test') for line in listing.stdout.splitlines()
                  if line.endswith(': test')}
              selected = sorted(name for name in names if assigned(name) == shard)
              if not selected:
                  raise RuntimeError('Native shard selected no tests: ' + shard)
              filters = ['--exact', *selected]
          # Failing tests and the ECU verifier retain their scenes under the temporary root.
          scratch = Path(os.environ['RUNNER_TEMP']) / 'native-scratch'
          scratch.mkdir()
          env = dict(os.environ, TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
          import tempfile
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as objects:
              if shard in ('all', 'protocol', 'projects', 'integration'):
                  env['AUTOSAR_TEST_OBJECTS'] = objects
              sys.exit(subprocess.run(['python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', *command, *filters], env=env).returncode)
      - name: Stop Windows process lifecycle trace
        if: always() && runner.os == 'Windows'
        timeout-minutes: 5
        shell: python
        env:
          AUTOSAR_ETW_REQUIRE_CONTROLS: ${{ matrix.shard == 'rest' }}
          # Selects the process timing baseline of this shard.
          AUTOSAR_ETW_LABEL: native-${{ matrix.shard }}
        run: &windows-job-trace-stop |
          import os
          from pathlib import Path
          from autosar_tooling.windows_etw import stop
          stop(Path(os.environ['RUNNER_TEMP']) / 'windows-job-evidence' / 'etw')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-scratch-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/native-scratch
            ${{ runner.temp }}/windows-job-evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows' && (failure() || cancelled())
        timeout-minutes: 2
        with:
          name: native-crash-dumps-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-crash-dumps
          if-no-files-found: ignore
          retention-days: 14
  native-windows:
    needs: changes
    if: &post-pr-native github.event_name != 'pull_request' && needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            shard: protocol
          - os: windows-2025-vs2026
            shard: projects
          - os: windows-2025-vs2026
            shard: integration
          - os: windows-2025-vs2026
            shard: rest
    name: native (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: *native-steps
  native-os:
    needs: changes
    if: *post-pr-native
    strategy:
      fail-fast: false
      matrix:
        # Windows splits the serial suites over two runners; each suite still runs alone.
        include:
          - os: ubuntu-24.04
            shard: 0/1
          - os: windows-2025-vs2026
            shard: 0/2
          - os: windows-2025-vs2026
            shard: 1/2
    name: native-os (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Collect Windows native crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: *windows-local-dumps
      - name: Start Windows process lifecycle trace
        if: runner.os == 'Windows'
        shell: python
        run: *windows-job-trace-start
      - name: Native OS conformance suites
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
          AUTOSAR_OS_SHARD: ${{ matrix.shard }}
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - name: Host I/O and lock failure boundaries
        if: matrix.shard == '0/1' || matrix.shard == '1/2'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py
      - name: Stop Windows process lifecycle trace
        if: always() && runner.os == 'Windows'
        timeout-minutes: 5
        shell: python
        run: *windows-job-trace-stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: os-suites-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/os-suites
            ${{ runner.temp }}/windows-job-evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows' && (failure() || cancelled())
        timeout-minutes: 2
        with:
          name: os-crash-dumps-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/native-crash-dumps
          if-no-files-found: ignore
          retention-days: 14
  native-sanitizers:
    # GCC sanitizers over native programs, OS suites and sealed ECU closures.
    needs: changes
    if: *post-pr-native
    strategy:
      fail-fast: false
      matrix:
        # TSan runs the serial OS suites on a second runner; ASan/UBSan keeps one job.
        include:
          - sanitize: thread
            part: programs
          - sanitize: thread
            part: os
          - sanitize: 'address,undefined'
            part: all
    name: native-sanitizers (${{ matrix.sanitize }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTOSAR_SANITIZE: ${{ matrix.sanitize }}
      # The OS host owns its alternate signal stack; native tests compare physical frames.
      ASAN_OPTIONS: use_sigaltstack=0:detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        if: matrix.part != 'os'
        with:
          linux-packages: gdb
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        if: matrix.part != 'os'
        shell: python
        run: *cargo-source-digest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.part != 'os'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-${{ env.CACHE_SOURCE }}
          # Prefer refreshed source snapshots before the legacy exact key.
          restore-keys: |
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          scratch = Path(os.environ['RUNNER_TEMP']) / 'sanitizer-scratch'
          scratch.mkdir()
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('TMPDIR=' + str(scratch) + '\n')
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      # setarch -R disables ASLR, which GCC 13's TSan needs on this runner.
      - name: Instrumented native programs
        if: matrix.part != 'os'
        run: >-
          setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core --features native-tests --test native
          --no-fail-fast -- 'runtime_contracts::' 'host::' 'integration::generated_c::'
          'integration::os::counter_header_oracles' 'sanitizers::sanitizer_lane_reports_deliberate_faults'
      - name: Instrumented sealed ECU protocols
        if: matrix.part != 'os'
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ['TMPDIR'])
          env = dict(os.environ, TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
          sys.exit(subprocess.run(['setarch', 'x86_64', '-R', 'python', '-m', 'autosar_tooling.ci_reporting', 'run', '--',
              'cargo', 'test', '--locked', '-p', 'autosar-config-core', '--features', 'native-tests', '--test', 'native',
              '--no-fail-fast', '--', 'integration::protocol::', 'integration::sealed_projects::', 'integration::sealed_sanitizers::'], env=env).returncode)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.part != 'os'
        with:
          name: sanitizer-scratch-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sanitizer-scratch
          if-no-files-found: ignore
          retention-days: 14
      - name: Instrumented OS suites
        if: matrix.part != 'programs'
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
        run: setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - name: Check concurrent native constructor rollback
        if: matrix.part != 'programs'
        run: setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py -k concurrent_event_construction_and_rollback
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.part != 'programs'
        with:
          name: os-suites-sanitizer-${{ strategy.job-index }}
          path: ${{ runner.temp }}/os-suites
          if-no-files-found: ignore
          retention-days: 14
  quality:
    # Body edits must run the issue-reference check again under CI required.
    if: >-
      inputs.release-revision == '' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      !(github.event.action == 'edited' && github.event.changes.title &&
        !github.event.changes.body && !github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: uv sync --locked
      - run: npm ci --prefix ui
      - name: Select baseline
        shell: python
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          import os, subprocess
          base = os.environ['BASE_REVISION']
          if base and set(base) == {'0'}:
              base = subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '--stdin'], input=b'').decode().strip()
          else:
              subprocess.run(['git', 'rev-parse', '--verify', base + '^{commit}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CHECK_BASE=' + base + '\n')
      # Check real PR commits, while source checks still inspect the synthetic merge.
      # Pushes check before..HEAD; a first push uses the empty-tree baseline above.
      - run: uv run --locked python -m autosar_tooling quality --scope all --base "$CHECK_BASE" --commit-head "$COMMIT_HEAD"
        env:
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Accounts each committed catalog in core/resources/requirements (ADR 0017) without the archive.
      - name: Requirement dispositions
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -m autosar_tooling requirements
      - name: Workflow syntax (actionlint)
        run: uv run --locked --group workflows actionlint
      - name: Workflow security (zizmor)
        env:
          # Online audits check that pinned commits belong to the referenced action.
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --group workflows zizmor .github
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0
      - name: Rust advisories, licenses and sources (cargo-deny)
        run: cargo deny --locked check
      - name: npm and Python lockfile advisories (osv-scanner)
        run: osv-scanner scan source --lockfile uv.lock --lockfile ui/package-lock.json

  c-analysis-prepare:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-prepare-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.release-revision || github.sha }}
      - name: Identify native build cache inputs
        shell: python
        run: *cargo-source-digest
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b
          path: build/cppcheck-source
      - name: Preserve pinned addon bytes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          source = Path('build/cppcheck-source')
          for name in ['misra.py', 'cppcheckdata.py', 'misra_9.py']:
              data = subprocess.check_output(['git', '-C', str(source), 'show', 'HEAD:addons/' + name])
              (source / 'addons' / name).write_bytes(data)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cppcheck-cache
        with:
          path: build/c-analysis-tools
          key: >-
            ${{ format('cppcheck-{0}-{1}-{2}-{3}-{4}', runner.os, runner.arch, env.CACHE_IMAGE,
            'e73bf44c3e49686b7495fab352d03a6c6075516b',
            hashFiles('.github/workflows/checks.yml', '.github/cmake/cppcheck-windows.cmake', 'pyproject.toml', 'uv.lock')) }}
      - name: Configure pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: >-
          uv run --locked cmake -S build/cppcheck-source -B build/cppcheck-build
          -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=OFF -DBUILD_GUI=OFF -DBUILD_TESTING=OFF
          ${{ runner.os == 'Windows' && format('"-DCMAKE_PROJECT_Cppcheck_INCLUDE={0}/.github/cmake/cppcheck-windows.cmake"', github.workspace) || '' }}
      - name: Build pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: >-
          uv run --locked cmake --build build/cppcheck-build
          --config Release --target cppcheck --parallel 2
      - name: Package analyzer
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          bundle = Path('build/c-analysis-tools')
          binaries = list(Path('build/cppcheck-build/bin').rglob('cppcheck.exe' if os.name == 'nt' else 'cppcheck'))
          if len(binaries) != 1:
              raise RuntimeError('Expected one built analyzer')
          bundle.mkdir()
          shutil.copy2(binaries[0], bundle / binaries[0].name)
          for name in ('addons', 'cfg'):
              shutil.copytree(Path('build/cppcheck-source') / name, bundle / name)
      - name: Verify and record analyzer provenance
        shell: python
        run: |
          import json, os, subprocess, tempfile
          from pathlib import Path
          from autosar_tooling.c_check import CPPCHECK_REVISION, tool_identity
          revision = subprocess.check_output(
              ['git', '-C', 'build/cppcheck-source', 'rev-parse', 'HEAD'], text=True).strip()
          if revision != CPPCHECK_REVISION:
              raise ValueError(f'Cppcheck source revision differs: {revision}')
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          os.environ['CPPCHECK'] = str(executable)
          os.environ['CPPCHECK_ADDON_DIR'] = str(bundle / 'addons')
          with tempfile.TemporaryDirectory() as directory:
              _, _, tool = tool_identity(Path(directory).resolve())
          del tool['filesDirectory']
          provenance = json.dumps({
              'sourceRevision': revision,
              'runner': {key: os.environ.get(key) for key in ('ImageOS', 'ImageVersion')},
              'tool': tool,
          }, indent=2)
          (bundle / 'provenance.json').write_text(provenance + '\n', encoding='utf-8')
          print(provenance)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-analysis-tools-${{ matrix.target }}
          overwrite: true
          path: build/c-analysis-tools
          if-no-files-found: error
          retention-days: 14

  c-analysis-prepare-windows:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: *analysis-prepare-steps


  c-analysis-generate:
    permissions:
      contents: read
      security-events: write
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ANALYSIS_SIDE: current
      ANALYSIS_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CURRENT_INPUTS: .
      PYTHONPATH: ${{ github.workspace }}/./tools/python/src
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-generate-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ env.ANALYSIS_SIDE == 'baseline' && needs.changes.outputs.source-parent || inputs.release-revision || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANALYSIS_SIDE == 'baseline'
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.release-revision || github.sha }}
          path: build/c-analysis-current-inputs
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: ${{ github.workspace }}/${{ env.CURRENT_INPUTS }}
      - name: Install current Python inputs
        shell: python
        run: |
          import os, subprocess
          subprocess.run(['uv', 'sync', '--locked', '--project', os.environ['CURRENT_INPUTS']], check=True)
      - uses: ./.github/actions/core-build-dependencies
        if: env.ANALYSIS_SIDE == 'current'
      - uses: ./build/c-analysis-current-inputs/.github/actions/core-build-dependencies
        if: env.ANALYSIS_SIDE == 'baseline'
      - name: Stage current sample inputs onto the first parent
        if: env.ANALYSIS_SIDE == 'baseline'
        shell: python
        run: |
          import os, subprocess
          subprocess.run(['uv', 'run', '--locked', '--project', os.environ['CURRENT_INPUTS'],
              'python', '-m', 'autosar_tooling.c_gate', 'stage', os.environ['GITHUB_WORKSPACE']], check=True)
      - name: Identify native build cache inputs
        shell: python
        run: *cargo-source-digest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v3-${{ env.CACHE_SOURCE }}
          # Each generator uses its normal root path and an independent Cargo target.
          restore-keys: |
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v3-
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Generate complete analysis samples
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          subprocess.run(['uv', 'run', '--locked', '--project', os.environ['CURRENT_INPUTS'],
              'python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', 'cargo', 'test',
              '--manifest-path', str(Path(os.environ['GITHUB_WORKSPACE']) / 'Cargo.toml'),
              '--locked', '-p', 'autosar-config-core', '--test', 'it', '--', 'c_analysis::'],
              cwd=os.environ['GITHUB_WORKSPACE'], check=True)
      - name: Validate generated sample inventory and tree
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          expected = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          if {p.name for p in Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES']).iterdir()} != expected:
              raise RuntimeError('Generated sample inventory is incomplete')
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('build/c-analysis-generation.json').write_text(json.dumps({
              'tree': tree, 'side': os.environ['ANALYSIS_SIDE'], 'target': os.environ['ANALYSIS_TARGET']
          }), encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-analysis-${{ env.ANALYSIS_SIDE == 'baseline' && 'base-inputs' || 'inputs' }}-${{ matrix.target }}
          overwrite: true
          path: |
            ${{ env.AUTOSAR_C_ANALYSIS_SAMPLES }}
            build/c-analysis-generation.json
          if-no-files-found: error
          retention-days: 14
      # After publishing, so a format failure still leaves the samples for diagnosis.
      - name: Generated C follows .clang-format
        if: env.ANALYSIS_SIDE == 'current'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_generated_format.py
      - name: Generated C compiles with clang warnings
        if: env.ANALYSIS_SIDE == 'current' && runner.os == 'Linux'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_clang_build.py
      - name: Generated C adds no clang-tidy findings to the baseline
        id: tidy
        if: env.ANALYSIS_SIDE == 'current' && runner.os == 'Linux'
        env:
          AUTOSAR_CLANG_TIDY_REPORT: build/clang-tidy.json
        run: uv run --locked python -m autosar_tooling quality --scope runtime --c-samples "$AUTOSAR_C_ANALYSIS_SAMPLES"
      - name: Convert clang-tidy diagnostics
        if: ${{ always() && env.ANALYSIS_SIDE == 'current' && runner.os == 'Linux' && hashFiles('build/clang-tidy.json') != '' }}
        env:
          TIDY_OUTCOME: ${{ steps.tidy.outcome }}
        run: python -m autosar_tooling.ci_reporting sarif --clang-tidy build/clang-tidy.json --analysis-outcome "$TIDY_OUTCOME" --output build/clang-tidy.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && env.ANALYSIS_SIDE == 'current' && runner.os == 'Linux' && hashFiles('build/clang-tidy.sarif') != '' }}
        with:
          sarif_file: build/clang-tidy.sarif
          category: clang-tidy-linux


