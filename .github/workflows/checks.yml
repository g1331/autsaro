    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-gate-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Match target checkout bytes
        if: matrix.target == 'windows-x64-controlled-v1'
        # Acceptance binds raw parser/document/producer bytes, including native CRLF.
        run: git -c core.autocrlf=true checkout-index --all --force
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: c-analysis-raw-*-${{ matrix.target }}-${{ matrix.group }}-*
          path: build/c-analysis-raw
      - name: Require exactly one scan per side
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLE: ${{ matrix.group }}
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          root = Path('build/c-analysis-raw')
          for side, result in [('current', 'c-analysis-results'), ('baseline', 'c-analysis-baseline')]:
              prefix = 'c-analysis-raw-' + side + '-' + os.environ['ANALYSIS_TARGET'] + '-' + os.environ['ANALYSIS_SAMPLE'] + '-'
              scans = list(root.glob(prefix + '*'))
              if len(scans) != 1:
                  raise RuntimeError('Missing or duplicated scan: ' + prefix + str(scans))
              shutil.copytree(scans[0], Path('build') / result)
      - name: Strict generated source gate
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLE: ${{ matrix.group }}
        shell: python
        run: |
          import os, subprocess, sys
          sys.exit(subprocess.run([sys.executable, '-m', 'autosar_tooling.c_gate', 'scan',
              '--target', os.environ['ANALYSIS_TARGET'],
              '--sample', os.environ['ANALYSIS_SAMPLE']]).returncode)
      - name: Summarize and convert Cppcheck diagnostics
        if: always()
        run: python -m autosar_tooling.ci_reporting sarif --cppcheck-directory build/c-analysis-results --baseline-directory build/c-analysis-baseline --output build/cppcheck.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && hashFiles('build/cppcheck.sarif') != '' }}
        with:
          sarif_file: build/cppcheck.sarif
          category: cppcheck-${{ matrix.target }}-${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A duplicated matrix identity must reach the aggregate twice, not overwrite.
          name: c-analysis-summaries-${{ matrix.target }}-${{ matrix.group }}-${{ strategy.job-index }}
          overwrite: true
          path: |
            build/c-analysis-results/*/summary.json
            build/c-analysis-results/*/baseline-summary.json
            build/c-analysis-results/*/gate.json
          if-no-files-found: error
          retention-days: 14
      # Offline context rebinding consumes these exact source bytes and raw receipts.
      # Raw producers separately retain full target-host replay inputs.
      - name: Retain source assessment inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: c-analysis-context-inputs-${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: |
            build/c-analysis-results/*/summary.json
            build/c-analysis-results/*/project
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14


  c-analysis-gates-windows:
    permissions:
      contents: read
      actions: read
      security-events: write
    needs: [c-analysis-prepare-windows, c-analysis-samples-windows, c-analysis-baseline-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: user-application
            samples: user-application
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: component-pipeline
            samples: component-pipeline
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: no-diagnostic
            samples: no-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: *analysis-gate-steps

  c-analysis:
    # A skipped/cancelled producer or shard must never make the gate green.
    needs: [changes, c-analysis-prepare, c-analysis-prepare-windows, c-analysis-samples, c-analysis-samples-windows, c-analysis-baseline, c-analysis-baseline-windows, c-analysis-gates, c-analysis-gates-windows]
    if: ${{ !cancelled() && needs.changes.outputs.analysis == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require every platform and sample group
        shell: python
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = {name: need['result'] for name, need in json.loads(os.environ['UPSTREAM_RESULTS']).items()}
          if any(result != 'success' for result in results.values()):
              raise RuntimeError('Incomplete platform/sample upstream: ' + str(results))
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: c-analysis-summaries-*
          path: build/c-analysis-summaries
      - name: Require eight complete sample results
        env:
          PYTHONPATH: tools/python/src
        shell: python
        run: |
          import json
          from pathlib import Path
          from autosar_tooling.c_sdk import validate_sources
          targets = {'linux-x64-controlled-v1', 'windows-x64-controlled-v1'}
          samples = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          expected = {(target, sample) for target in targets for sample in samples}
          found = set()
          for path in Path('build/c-analysis-summaries').glob('*/*/summary.json'):
              summary = json.loads(path.read_text(encoding='utf-8'))
              pair = (summary['scope']['target'], path.parent.name)
              if pair in found or summary['error'] is not None:
                  raise RuntimeError('Duplicate or incomplete analysis result: ' + str(path))
              validate_sources(summary)
              found.add(pair)
          if found != expected:
              raise RuntimeError('Expected all eight platform/sample results; missing=' + str(expected - found) + '; extra=' + str(found - expected))
      - name: Require eight fresh no-regression gate receipts
        run: python -m autosar_tooling.c_gate aggregate build/c-analysis-summaries

  required:
    # The only status check branch rules require; the list of blocking jobs lives here.
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'Unselected PR label' || 'CI required' }}
    needs: [changes, desktop-scenarios, python, core, desktop, native, native-os, native-sanitizers, native-delivery, native-delivery-windows, quality, c-analysis]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking job
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes']['outputs'] if needs['changes']['result'] == 'success' else {}
          code = outputs.get('code') != 'false'
          NATIVE_JOBS = {'core', 'native', 'native-os', 'native-sanitizers', 'native-delivery', 'native-delivery-windows'}
          def accepted(name):
              if name in {'changes', 'quality'}:
                  return {'success'}
              selection = ('desktop' if name == 'desktop-scenarios' else
                  'application' if name == 'desktop' else
                  'analysis' if name == 'c-analysis' else 'native' if name in NATIVE_JOBS else 'code')
              return {'success', 'skipped'} if outputs.get(selection) == 'false' else {'success'}
          failed = {name: need['result'] for name, need in needs.items() if need['result'] not in accepted(name)}
          print('code=' + str(code).lower(), 'selection=' + str(outputs), {name: need['result'] for name, need in needs.items()})
          sys.exit('Blocking jobs did not pass: ' + str(failed) if failed else 0)

  extended:
    # Same run, revision and fork token; never feeds back into CI required.
    needs: required
    if: ${{ !cancelled() && needs.required.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/extended.yml
