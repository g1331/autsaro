name: Development checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base:
        description: Incremental check baseline commit
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run lint --prefix ui
      - run: npm run test --prefix ui
      - run: npm run build --prefix ui
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tools tests/python scripts
      - run: uv run --locked python -B -m unittest discover -s tests/python
      - run: uv build --out-dir build/python
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: build/python
          if-no-files-found: ignore
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev clang pkg-config
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -A clippy::all -D clippy::correctness -D clippy::suspicious
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev clang pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
  process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s tests/python/process
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - run: uv sync --locked
      - run: npm ci --prefix ui
      - name: Select baseline
        shell: python
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          import os, subprocess
          base = os.environ['BASE_REVISION']
          if base and set(base) == {'0'}:
              base = subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '--stdin'], input=b'').decode().strip()
          else:
              subprocess.run(['git', 'rev-parse', '--verify', base + '^{commit}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CHECK_BASE=' + base + '\n')
      - run: uv run --locked python -m autosar_tooling quality --scope all --base "${{ env.CHECK_BASE }}"

  c-analysis-prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
          - os: windows-latest
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Identify native build cache inputs
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Linux analysis dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libxml2-dev libclang-dev clang pkg-config
      - uses: ./.github/actions/native-analysis-compiler
      - name: Create vcpkg binary cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build/vcpkg-cache | Out-Null
      - uses: actions/cache@v6.1.0
        if: runner.os == 'Windows'
        with:
          path: build/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.CACHE_IMAGE }}-static-md-v1
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Windows core dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = (Resolve-Path build/vcpkg-cache).Path
          vcpkg install 'libxml2[iconv,zlib]:x64-windows-static-md'
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          'VCPKGRS_TRIPLET=x64-windows-static-md' >> $env:GITHUB_ENV
          'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> $env:GITHUB_ENV
      - uses: actions/checkout@v7.0.1
        with:
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b
          path: build/cppcheck-source
      - name: Preserve pinned addon bytes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          source = Path('build/cppcheck-source')
          for name in ['misra.py', 'cppcheckdata.py', 'misra_9.py']:
              data = subprocess.check_output(['git', '-C', str(source), 'show', 'HEAD:addons/' + name])
              (source / 'addons' / name).write_bytes(data)
      - uses: actions/cache@v6.1.0
        id: cppcheck-cache
        with:
          path: build/c-analysis-tools
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_IMAGE }}-e73bf44c3e49686b7495fab352d03a6c6075516b-v1
      - name: Configure pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake -S build/cppcheck-source -B build/cppcheck-build -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=OFF -DBUILD_GUI=OFF -DBUILD_TESTING=OFF
      - name: Build pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake --build build/cppcheck-build --config Release --target cppcheck --parallel 2
      - name: Package analyzer
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          bundle = Path('build/c-analysis-tools')
          binaries = list(Path('build/cppcheck-build/bin').rglob('cppcheck.exe' if os.name == 'nt' else 'cppcheck'))
          if len(binaries) != 1:
              raise RuntimeError('Expected one built analyzer')
          bundle.mkdir()
          shutil.copy2(binaries[0], bundle / binaries[0].name)
          for name in ('addons', 'cfg'):
              shutil.copytree(Path('build/cppcheck-source') / name, bundle / name)
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}-v1
      - name: Analyzer behavior tests
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_c_analysis.py
      - name: Host I/O and lock failure boundaries
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py
      - name: Source save publication and recovery regressions
        run: cargo test --locked --manifest-path core/Cargo.toml --lib arxml::persistence::tests
      - name: Generate complete analysis samples
        run: cargo test --locked --manifest-path core/Cargo.toml --test c_analysis
      - name: Sealed ECU build mode fault isolation
        run: uv run --locked python -B -m unittest discover -s tests/python/native -p test_ecu_build_modes.py
      - name: Validate generated sample inventory
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = {'signals', 'diagnostic', 'capacity', 'standard-ecu', 'user-application'}
          if {p.name for p in Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES']).iterdir()} != expected:
              raise RuntimeError('Generated sample inventory is incomplete')
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          overwrite: true
          path: |
            build/c-analysis-tools
            build/c-analysis-samples
          if-no-files-found: error
          retention-days: 14

  c-analysis-samples:
    needs: c-analysis-prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: host
            samples: signals,diagnostic,capacity
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            group: user-application
            samples: user-application
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: host
            samples: signals,diagnostic,capacity
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: standard-ecu
            samples: standard-ecu
          - os: windows-latest
            target: windows-x64-controlled-v1
            group: user-application
            samples: user-application
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/download-artifact@v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - name: Verify complete generated-project analysis
        shell: python
        env:
          ANALYSIS_TARGET: ${{ matrix.target }}
          ANALYSIS_SAMPLES: ${{ matrix.samples }}
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          failed = False
          samples = Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES'])
          expected = set(os.environ['ANALYSIS_SAMPLES'].split(','))
          for name in sorted(expected):
              output = Path('build/c-analysis-results') / name
              result = subprocess.run(['uv', 'run', '--locked', 'python', '-m', 'autosar_tooling',
                  'c-check', '--target', os.environ['ANALYSIS_TARGET'], '--project', str(samples / name),
                  '--output-directory', str(output)])
              try:
                  summary = json.loads((output / 'summary.json').read_text(encoding='utf-8'))
                  complete = summary['error'] is None and result.returncode == (0 if summary['passed'] else 1)
                  print(name, 'analysis_complete=' + str(complete), 'source_passed=' + str(summary['passed']))
                  failed = not complete or failed
              except (OSError, ValueError, KeyError) as error:
                  print(name, error)
                  failed = True
          sys.exit(1 if failed else 0)
      # Existing source remediation precedes automatic strict source gating.
      # Readiness above verifies complete analysis; it does not approve violations.
      - name: Strict generated source gate
        if: github.event_name == 'workflow_dispatch'
        shell: python
        env:
          ANALYSIS_SAMPLES: ${{ matrix.samples }}
        run: |
          import json, os, sys
          from pathlib import Path
          summaries = list(Path('build/c-analysis-results').glob('*/summary.json'))
          passed = len(summaries) == len(os.environ['ANALYSIS_SAMPLES'].split(',')) and all(json.loads(p.read_text(encoding='utf-8'))['passed'] for p in summaries)
          sys.exit(0 if passed else 1)
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: c-analysis-summaries-${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: build/c-analysis-results/*/summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: c-analysis-${{ matrix.target }}-${{ matrix.group }}
          overwrite: true
          path: build/c-analysis-results
          if-no-files-found: ignore
          retention-days: 14

  c-analysis:
    # A skipped/cancelled producer or shard must never make the gate green.
    needs: [c-analysis-prepare, c-analysis-samples]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: c-analysis-summaries-*
          path: build/c-analysis-summaries
      - name: Require every platform and sample group
        env:
          PREPARE_RESULT: ${{ needs.c-analysis-prepare.result }}
          ANALYSIS_RESULT: ${{ needs.c-analysis-samples.result }}
        run: test "$PREPARE_RESULT" = success && test "$ANALYSIS_RESULT" = success
      - name: Require ten complete sample results
        shell: python
        run: |
          import json
          from pathlib import Path
          targets = {'linux-x64-controlled-v1', 'windows-x64-controlled-v1'}
          samples = {'signals', 'diagnostic', 'capacity', 'standard-ecu', 'user-application'}
          expected = {(target, sample) for target in targets for sample in samples}
          found = set()
          for path in Path('build/c-analysis-summaries').glob('*/*/summary.json'):
              summary = json.loads(path.read_text(encoding='utf-8'))
              pair = (summary['scope']['target'], path.parent.name)
              if pair in found or summary['error'] is not None:
                  raise RuntimeError('Duplicate or incomplete analysis result: ' + str(path))
              found.add(pair)
          if found != expected:
              raise RuntimeError('Expected all ten platform/sample results; missing=' + str(expected - found) + '; extra=' + str(found - expected))
