    steps: *analysis-gate-steps

  c-analysis:
    # A skipped/cancelled producer or shard must never make the gate green.
    needs: [changes, c-analysis-prepare, c-analysis-prepare-windows, c-analysis-generate, c-analysis-generate-windows, c-analysis-baseline-generate, c-analysis-baseline-generate-windows, c-analysis-samples, c-analysis-samples-windows, c-analysis-baseline, c-analysis-baseline-windows, c-analysis-behavior, c-analysis-behavior-windows, c-analysis-gates, c-analysis-gates-windows]
    if: ${{ !cancelled() && needs.changes.outputs.analysis == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ inputs.release-revision || github.sha }}
      - name: Require every platform and sample group
        shell: python
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = {name: need['result'] for name, need in json.loads(os.environ['UPSTREAM_RESULTS']).items()}
          if any(result != 'success' for result in results.values()):
              raise RuntimeError('Incomplete platform/sample upstream: ' + str(results))
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: c-analysis-summaries-*
          path: build/c-analysis-summaries
      - name: Require eight complete sample results
        env:
          PYTHONPATH: tools/python/src
        shell: python
        run: |
          import json
          from pathlib import Path
          from autosar_tooling.c_sdk import validate_sources
          targets = {'linux-x64-controlled-v1', 'windows-x64-controlled-v1'}
          samples = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          expected = {(target, sample) for target in targets for sample in samples}
          found = set()
          for path in Path('build/c-analysis-summaries').glob('*/*/summary.json'):
              summary = json.loads(path.read_text(encoding='utf-8'))
              pair = (summary['scope']['target'], path.parent.name)
              if pair in found or summary['error'] is not None:
                  raise RuntimeError('Duplicate or incomplete analysis result: ' + str(path))
              validate_sources(summary)
              found.add(pair)
          if found != expected:
              raise RuntimeError('Expected all eight platform/sample results; missing=' + str(expected - found) + '; extra=' + str(found - expected))
      - name: Require eight fresh source gate receipts
        env:
          GATE_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'strict' }}
        run: python -m autosar_tooling.c_gate aggregate build/c-analysis-summaries --mode "$GATE_MODE"

  required:
    # The only status check branch rules require; the list of blocking jobs lives here.
    name: >-
      ${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'Unselected PR label' ||
          github.event.action == 'edited' && github.event.changes.title &&
          !github.event.changes.body && !github.event.changes.base && 'PR title edit' || 'CI required' }}
    needs: [changes, python, core, desktop, native, native-delivery, native-delivery-windows, quality, c-analysis]
    # Evaluate failed and skipped dependencies, but let a superseded PR run cancel.
    if: >-
      ${{ always() && (github.event_name != 'pull_request' || !cancelled()) &&
          inputs.release-revision == '' &&
          (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
          !(github.event.action == 'edited' && github.event.changes.title &&
            !github.event.changes.body && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking job
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          import json, os, sys
          if os.environ.get('DRAFT') == 'true':
              sys.exit('Draft PR: full checks await ready_for_review (草稿，完整检查待转就绪).')
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes']['outputs'] if needs['changes']['result'] == 'success' else {}
          code = outputs.get('code') != 'false'
          NATIVE_JOBS = {'core', 'native', 'native-delivery', 'native-delivery-windows'}
          def accepted(name):
              if name in {'changes', 'quality'}:
                  return {'success'}
              selection = ('application' if name == 'desktop' else
                  'analysis' if name == 'c-analysis' else 'native' if name in NATIVE_JOBS else 'code')
              return {'success', 'skipped'} if outputs.get(selection) == 'false' else {'success'}
          failed = {name: need['result'] for name, need in needs.items() if need['result'] not in accepted(name)}
          print('code=' + str(code).lower(), 'selection=' + str(outputs), {name: need['result'] for name, need in needs.items()})
          sys.exit('Blocking jobs did not pass: ' + str(failed) if failed else 0)

  extended:
    # Keep the same revision, and still collect Extended results if a fast check failed.
    needs: required
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/extended.yml

  master-result:
    name: Post-merge checks result
    needs: [required, native-windows, native-os, native-sanitizers, desktop-scenarios, extended]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Summarize results and report unsuccessful runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Master CI failed (run $GITHUB_RUN_ID)"
          {
            printf 'Master commit %s · [run %s, attempt %s](%s/attempts/%s)\n\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$run_url" "$GITHUB_RUN_ATTEMPT"
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            exit 0
          fi
          existing=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=all&labels=area%3Aquality-ci&per_page=100" |
            jq -rs --arg title "$title" \
              '[.[][] | select(.pull_request == null and .title == $title) | .number][0] // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label area:quality-ci \
              --body-file "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
