name: Development checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base:
        description: Incremental check baseline commit
        required: true
# Keep the non-required tail from locking another master revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
permissions:
  contents: read
  pull-requests: read
env:
  PYTHONUTF8: '1'
  PYTHONPATH: tools/python/src
jobs:
  changes:
    name: Detect changed areas
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      native: ${{ steps.detect.outputs.native }}
      desktop: ${{ steps.detect.outputs.desktop }}
      analysis: ${{ steps.detect.outputs.analysis }}
      application: ${{ steps.detect.outputs.application }}
    steps:
      # Standards records and the fixed guideline index are consumed analysis inputs.
      # Pull requests touching only reader documentation and design records
      # skip build and test jobs; pushes keep the full non-GUI checks.
      # Pull requests that otherwise change only ui/ also skip the core, native and C analysis
      # jobs: none of their inputs is under ui/ (tests/python/test_ci_selection.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.before }}
        run: |
          import json, os, subprocess
          from autosar_tooling.ci_selection import select_changes
          rows = None
          if os.environ['PULL_REQUEST']:
              pages = json.loads(subprocess.run(['gh', 'api', '--paginate', '--slurp',
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PULL_REQUEST']}/files"],
                  check=True, capture_output=True, text=True).stdout)
              rows = [row for page in pages for row in page]
          elif os.environ.get('BASE') and set(os.environ['BASE']) != {'0'}:
              diff = subprocess.run(['git', 'diff', '--no-renames', '--name-only',
                  os.environ['BASE'], os.environ['GITHUB_SHA']], capture_output=True, text=True)
              if diff.returncode == 0:
                  rows = [dict(filename=path, status='modified') for path in diff.stdout.split()]
          if rows is not None:
              print('\n'.join(path for row in rows
                  for path in (row['filename'], row.get('previous_filename')) if path))
          values = select_changes(rows, pull_request=bool(os.environ['PULL_REQUEST']))
          print(values)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(key + '=' + str(value).lower() + '\n')

  desktop-scenarios:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
  python:
    # Short checks follow preparation so long native jobs can claim the first runners.
    needs: [changes, c-analysis-prepare, c-analysis-prepare-windows]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest on Linux, newest on Windows; extended.yml runs the rest of the
        # matrix after merging. native-delivery runs all samples on receiver 3.11 only;
        # these Python jobs cover newer ecu_tools interpreters, Extended the full receiver matrix.
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tools tests/python scripts
      - run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python
      # Managed process tests once per platform, without a runner of their own.
      - name: Managed process tests
        if: matrix.python == '3.12' || runner.os == 'Windows'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/process
      - run: uv build --out-dir build/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: build/python
          if-no-files-found: ignore
  core:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/core-build-dependencies
      - run: python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core
      - name: Runtime build identities and dependency pinning
        env:
          PYTHONPATH: tools/python/src
        run: python3 -B -m unittest discover -s tests/python/native -p test_asset_build.py
      # Lint every feature, including the native and official test binaries that only manual
      # acceptance runs. core/clippy.toml and module attributes add the generation rules.
      - run: cargo clippy --locked -p autosar-config-core --all-targets --all-features -- -D warnings
      # The committed fuzz corpus and reproducers replay as ordinary tests; fuzzing itself runs
      # in extended.yml with the pinned nightly (docs/development/testing/fuzzing.md).
      - run: python -m autosar_tooling.ci_reporting run -- cargo test --locked --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
  desktop:
    # Short checks follow preparation so long native jobs can claim the first runners.
    needs: [changes, c-analysis-prepare, c-analysis-prepare-windows]
    if: ${{ !cancelled() && needs.changes.outputs.application == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - if: ${{ !cancelled() }}
        run: npm ci --prefix ui
      - if: ${{ !cancelled() }}
        run: npm run lint --prefix ui
      - if: ${{ !cancelled() }}
        run: python -m autosar_tooling.ci_reporting run -- npm run test --prefix ui
      - if: ${{ !cancelled() }}
        run: npm run build --prefix ui
      # Desktop tests are compile-bound: the dev profile keeps the GUI dependencies unoptimized
      # and shared with the build below.
      - if: ${{ !cancelled() }}
        run: python -m autosar_tooling.ci_reporting run -- cargo test --locked --profile dev -p autosar-config-desktop
      - if: ${{ !cancelled() }}
        run: npm run ipc:check --prefix ui
      - if: ${{ !cancelled() }}
        run: cargo build --locked -p autosar-config-desktop
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo clippy --locked -p autosar-config-desktop --all-targets -- -D warnings
  native:
    # Native suites that need GCC but no licensed archive; the rest stay in acceptance.yml.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows separates measured long modules; Linux keeps one job.
        include:
          - os: ubuntu-24.04
            shard: all
          - os: windows-latest
            shard: protocol
          - os: windows-latest
            shard: projects
          - os: windows-latest
            shard: integration
          - os: windows-latest
            shard: rest
    name: native (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        shell: python
        run: &cargo-source-digest |
          import hashlib, os, subprocess
          from pathlib import Path
          # Only tracked inputs participate, even after imports/builds create new files.
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--',
              'core', 'runtime', 'third_party/freertos', 'tools/python/src/ecu_tools', 'LICENSE', 'NOTICE'])
          digest = hashlib.sha256()
          tracked = sorted(path for path in paths.split(b'\0') if path)
          for path in tracked:
              digest.update(path + b'\0')
              digest.update(hashlib.sha256(Path(os.fsdecode(path)).read_bytes()).digest())
          source = digest.hexdigest()
          print(f'Cargo source digest: {source} ({len(tracked)} tracked inputs)', flush=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CACHE_IMAGE=' + os.environ['ImageOS'] + '-' + os.environ['ImageVersion'] + '\n')
              output.write('CACHE_SOURCE=' + source + '\n')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-${{ env.CACHE_SOURCE }}
          # Prefer refreshed source snapshots before the legacy exact key.
          restore-keys: |
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      # One classifier partitions exact test names; the complement includes new modules.
      - name: Native library and contract suites
        shell: python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          groups = {
              'protocol': ['integration::protocol::'],
              'projects': ['integration::sealed_projects::', 'integration::single_component::',
                  'integration::release_contracts::'],
              'integration': ['integration::'],
              'rest': [],
          }
          shard = os.environ['SHARD']
          command = ['cargo', 'test', '--locked', '-p', 'autosar-config-core', '--features', 'native-tests',
              '--lib', '--test', 'native', '--no-fail-fast', '--']
          filters = []
          if shard != 'all':
              # A measured long tail belongs with the smaller complement, independently of its module.
              outlier = ('integration::single_component::'
                  'short_application_period_saves_builds_and_passes_reference_verifier')
              def assigned(name):
                  if name == outlier:
                      return 'rest'
                  return next((group for group, prefixes in groups.items()
                      if any(name.startswith(prefix) for prefix in prefixes)), 'rest')
              listing = subprocess.run([*command, '--list'], capture_output=True, text=True)
              print(listing.stdout, end='', flush=True)
              print(listing.stderr, end='', file=sys.stderr, flush=True)
              if listing.returncode:
                  sys.exit(listing.returncode)
              names = {line.removesuffix(': test') for line in listing.stdout.splitlines()
                  if line.endswith(': test')}
              selected = sorted(name for name in names if assigned(name) == shard)
              if not selected:
                  raise RuntimeError('Native shard selected no tests: ' + shard)
              filters = ['--exact', *selected]
          # Failing tests and the ECU verifier retain their scenes under the temporary root.
          scratch = Path(os.environ['RUNNER_TEMP']) / 'native-scratch'
          scratch.mkdir()
          env = dict(os.environ, TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
          sys.exit(subprocess.run(['python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', *command, *filters], env=env).returncode)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-scratch-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-scratch
          if-no-files-found: ignore
          retention-days: 14
  native-os:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows splits the serial suites over two runners; each suite still runs alone.
        include:
          - os: ubuntu-24.04
            shard: 0/1
          - os: windows-latest
            shard: 0/2
          - os: windows-latest
            shard: 1/2
    name: native-os (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Native OS conformance suites
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
          AUTOSAR_OS_SHARD: ${{ matrix.shard }}
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: os-suites-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/os-suites
          if-no-files-found: ignore
          retention-days: 14
      - name: Host I/O and lock failure boundaries
        if: matrix.shard == '0/1' || matrix.shard == '1/2'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py
  native-sanitizers:
    # GCC sanitizers over native programs, OS suites and sealed ECU closures.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # TSan runs the serial OS suites on a second runner; ASan/UBSan keeps one job.
        include:
          - sanitize: thread
            part: programs
          - sanitize: thread
            part: os
          - sanitize: 'address,undefined'
            part: all
    name: native-sanitizers (${{ matrix.sanitize }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTOSAR_SANITIZE: ${{ matrix.sanitize }}
      # The OS host owns its alternate signal stack; native tests compare physical frames.
      ASAN_OPTIONS: use_sigaltstack=0:detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        if: matrix.part != 'os'
      - uses: ./.github/actions/native-analysis-compiler
      - name: Identify native build cache inputs
        if: matrix.part != 'os'
        shell: python
        run: *cargo-source-digest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.part != 'os'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-${{ env.CACHE_SOURCE }}
          # Prefer refreshed source snapshots before the legacy exact key.
          restore-keys: |
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            native-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          scratch = Path(os.environ['RUNNER_TEMP']) / 'sanitizer-scratch'
          scratch.mkdir()
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('TMPDIR=' + str(scratch) + '\n')
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      # setarch -R disables ASLR, which GCC 13's TSan needs on this runner.
      - name: Instrumented native programs
        if: matrix.part != 'os'
        run: >-
          setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core --features native-tests --test native
          --no-fail-fast -- 'runtime_contracts::' 'host::' 'integration::generated_c::'
          'integration::os::counter_header_oracles' 'sanitizers::sanitizer_lane_reports_deliberate_faults'
      - name: Instrumented sealed ECU protocols
        if: matrix.part != 'os'
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ['TMPDIR'])
          env = dict(os.environ, TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
          sys.exit(subprocess.run(['setarch', 'x86_64', '-R', 'python', '-m', 'autosar_tooling.ci_reporting', 'run', '--',
              'cargo', 'test', '--locked', '-p', 'autosar-config-core', '--features', 'native-tests', '--test', 'native',
              '--no-fail-fast', '--', 'integration::protocol::', 'integration::sealed_projects::', 'integration::sealed_sanitizers::'], env=env).returncode)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.part != 'os'
        with:
          name: sanitizer-scratch-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sanitizer-scratch
          if-no-files-found: ignore
          retention-days: 14
      - name: Instrumented OS suites
        if: matrix.part != 'programs'
        env:
          AUTOSAR_OS_OUTPUT_DIRECTORY: ${{ runner.temp }}/os-suites
        run: setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -v -s tests/python/native -p test_os_suites.py
      - name: Check concurrent native constructor rollback
        if: matrix.part != 'programs'
        run: setarch x86_64 -R python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_host_boundaries.py -k concurrent_event_construction_and_rollback
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.part != 'programs'
        with:
          name: os-suites-sanitizer-${{ strategy.job-index }}
          path: ${{ runner.temp }}/os-suites
          if-no-files-found: ignore
          retention-days: 14
  quality:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: uv sync --locked
      - run: npm ci --prefix ui
      - name: Select baseline
        shell: python
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          import os, subprocess
          base = os.environ['BASE_REVISION']
          if base and set(base) == {'0'}:
              base = subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '--stdin'], input=b'').decode().strip()
          else:
              subprocess.run(['git', 'rev-parse', '--verify', base + '^{commit}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CHECK_BASE=' + base + '\n')
      - run: uv run --locked python -m autosar_tooling quality --scope all --base "$CHECK_BASE"
      # Accounts each committed catalog in core/resources/requirements (ADR 0017) without the archive.
      - name: Requirement dispositions
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -m autosar_tooling requirements
      - name: Workflow syntax (actionlint)
        run: uv run --locked --group workflows actionlint
      - name: Workflow security (zizmor)
        env:
          # Online audits check that pinned commits belong to the referenced action.
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --group workflows zizmor .github
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.7.0
      - name: Rust advisories, licenses and sources (cargo-deny)
        run: cargo deny --locked check
      - name: npm and Python lockfile advisories (osv-scanner)
        run: osv-scanner scan source --lockfile uv.lock --lockfile ui/package-lock.json

  c-analysis-prepare:
    permissions:
      contents: read
      security-events: write
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &analysis-prepare-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify native build cache inputs
        shell: python
        run: *cargo-source-digest
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: build-essential cmake
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b
          path: build/cppcheck-source
      - name: Preserve pinned addon bytes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          source = Path('build/cppcheck-source')
          for name in ['misra.py', 'cppcheckdata.py', 'misra_9.py']:
              data = subprocess.check_output(['git', '-C', str(source), 'show', 'HEAD:addons/' + name])
              (source / 'addons' / name).write_bytes(data)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cppcheck-cache
        with:
          path: build/c-analysis-tools
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_IMAGE }}-e73bf44c3e49686b7495fab352d03a6c6075516b-v1
      - name: Configure pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake -S build/cppcheck-source -B build/cppcheck-build -DCMAKE_BUILD_TYPE=Release -DUSE_MATCHCOMPILER=OFF -DBUILD_GUI=OFF -DBUILD_TESTING=OFF
      - name: Build pinned open Cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: cmake --build build/cppcheck-build --config Release --target cppcheck --parallel 2
      - name: Package analyzer
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          bundle = Path('build/c-analysis-tools')
          binaries = list(Path('build/cppcheck-build/bin').rglob('cppcheck.exe' if os.name == 'nt' else 'cppcheck'))
          if len(binaries) != 1:
              raise RuntimeError('Expected one built analyzer')
          bundle.mkdir()
          shutil.copy2(binaries[0], bundle / binaries[0].name)
          for name in ('addons', 'cfg'):
              shutil.copytree(Path('build/cppcheck-source') / name, bundle / name)
      - name: Select analyzer
        shell: python
        run: |
          import os
          from pathlib import Path
          bundle = Path('build/c-analysis-tools').resolve(strict=True)
          executable = bundle / ('cppcheck.exe' if os.name == 'nt' else 'cppcheck')
          if os.name != 'nt':
              executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CPPCHECK=' + str(executable) + '\n')
              output.write('CPPCHECK_ADDON_DIR=' + str(bundle / 'addons') + '\n')
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v2-${{ env.CACHE_SOURCE }}
          # v2 can save both tree builds; an immutable v1 hit could never add the baseline.
          restore-keys: |
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v2-
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1-
            c-analysis-cargo-${{ runner.os }}-${{ env.CACHE_IMAGE }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-v1
      - name: Generate complete analysis samples
        run: python -m autosar_tooling.ci_reporting run -- cargo test --locked -p autosar-config-core --test it -- 'c_analysis::'
      - name: Select source comparison parent
        id: source-parent
        shell: python
        run: |
          import os, subprocess
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^1'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + parent + '\n')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source-parent.outputs.sha }}
          path: build/c-analysis-base-tree
      - name: Generate first-parent samples with current sample inputs
        run: python -m autosar_tooling.c_gate prepare build/c-analysis-base-tree
      - name: Validate generated sample inventory
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = {'standard-ecu', 'user-application', 'component-pipeline', 'no-diagnostic'}
          if {p.name for p in Path(os.environ['AUTOSAR_C_ANALYSIS_SAMPLES']).iterdir()} != expected:
              raise RuntimeError('Generated sample inventory is incomplete')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          overwrite: true
          path: |
            build/c-analysis-tools
            build/c-analysis-samples
            build/c-analysis-base-samples
          if-no-files-found: error
          retention-days: 14
      # After publishing, so a format failure still leaves the samples for diagnosis.
      - name: Generated C follows .clang-format
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_generated_format.py
      - name: Generated C compiles with clang warnings
        if: runner.os == 'Linux'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_clang_build.py
      - name: Generated C adds no clang-tidy findings to the baseline
        id: tidy
        if: runner.os == 'Linux'
        env:
          AUTOSAR_CLANG_TIDY_REPORT: build/clang-tidy.json
        run: uv run --locked python -m autosar_tooling quality --scope runtime --c-samples "$AUTOSAR_C_ANALYSIS_SAMPLES"
      - name: Convert clang-tidy diagnostics
        if: ${{ always() && runner.os == 'Linux' && hashFiles('build/clang-tidy.json') != '' }}
        env:
          TIDY_OUTCOME: ${{ steps.tidy.outcome }}
        run: python -m autosar_tooling.ci_reporting sarif --clang-tidy build/clang-tidy.json --analysis-outcome "$TIDY_OUTCOME" --output build/clang-tidy.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && runner.os == 'Linux' && hashFiles('build/clang-tidy.sarif') != '' }}
        with:
          sarif_file: build/clang-tidy.sarif
          category: clang-tidy-linux


  c-analysis-prepare-windows:
    permissions:
      contents: read
      security-events: write
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64-controlled-v1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: *analysis-prepare-steps

  native-delivery:
    # Builds and receives the prepared samples; runs beside their analysis rather than before it.
    needs: [changes, c-analysis-prepare]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows builds take about three times longer, so its receiver runs on a second runner.
        include:
          - os: ubuntu-24.04
            target: linux-x64-controlled-v1
            part: all
    name: native-delivery (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSAR_C_ANALYSIS_SAMPLES: ${{ github.workspace }}/build/c-analysis-samples
    steps: &native-delivery-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-analysis-inputs-${{ matrix.target }}
          path: build
      # The sealed build and receiver checks resolve the same absolute tools.
      - name: Select native contract tools
        shell: python
        run: |
          import os, shutil, subprocess
          from pathlib import Path
          tools = {'AUTOSAR_CC': 'gcc', 'AUTOSAR_OBJDUMP': 'objdump', 'AUTOSAR_NM': 'nm', 'AUTOSAR_GIT': 'git'}
          # The project environment's interpreter, as used by the development tooling.
          python = subprocess.run(['uv', 'run', '--locked', 'python', '-c', 'import sys; print(sys.executable)'],
              check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, name in tools.items():
                  output.write(variable + '=' + str(Path(shutil.which(name)).absolute()) + '\n')
              output.write('AUTOSAR_PYTHON=' + str(Path(python).absolute()) + '\n')
      - name: Sealed ECU build mode fault isolation
        if: matrix.part != 'receiver'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_ecu_build_modes.py
      # The generated CMake build (uv-locked CMake and Ninja) compiles the target.json closure.
      - name: CMake build matches the sealed ECU build
        if: matrix.part != 'receiver'
        run: python -m autosar_tooling.ci_reporting run -- uv run --locked python -B -m unittest discover -s tests/python/native -p test_cmake_build.py
      # Oldest supported receiver runs every sample; Extended covers the full interpreter matrix.
      - name: All moved samples build and run with receiver Python 3.11
        if: matrix.part != 'builds'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run(['uv', 'python', 'install', '--no-bin', '3.11'], check=True)
          receiver = subprocess.check_output(['uv', 'python', 'find', '--no-project', '--managed-python', '3.11'], text=True).strip()
          print(f'Receiver Python 3.11: {receiver}', flush=True)
          result = subprocess.run(['python', '-m', 'autosar_tooling.ci_reporting', 'run', '--', 'uv', 'run', '--locked', 'python', '-B', '-m', 'unittest', 'discover', '-s', 'tests/python/native', '-p', 'test_offline_delivery.py'],
              env={**os.environ, 'AUTOSAR_RECEIVER_PYTHON': receiver,
                   'AUTOSAR_RECEIVER_SAMPLES': 'standard-ecu user-application component-pipeline no-diagnostic'})
          if result.returncode:
              print(f'::error title=Receiver Python 3.11::The moved packages did not build and run with {receiver}', flush=True)
          sys.exit(result.returncode)


  native-delivery-windows:
    # Builds and receives the prepared samples; runs beside their analysis rather than before it.
    needs: [changes, c-analysis-prepare-windows]
    if: needs.changes.outputs.native == 'true'
    strategy:
