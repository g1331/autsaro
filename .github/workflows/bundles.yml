name: Build application bundles
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit or branch to build
        default: master
        required: true
permissions:
  contents: read
jobs:
  revision:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - id: revision
        name: Require the selected revision to support strict source analysis
        env:
          PYTHONPATH: tools/python/src
        shell: python
        run: |
          import os, subprocess, sys
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          result = subprocess.run([sys.executable, '-m', 'autosar_tooling.c_gate', 'release-ready'])
          if result.returncode:
              sys.exit(f'{revision} does not support fingerprint-bound strict release analysis')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={revision}\n')
  source-analysis:
    needs: revision
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/checks.yml
    with:
      release-revision: ${{ needs.revision.outputs.sha }}
  bundle:
    needs: [revision, source-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.revision.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: ./.github/actions/core-build-dependencies
        with:
          linux-packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - run: npm ci --prefix ui
      - run: npm run tauri --prefix ui -- build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ runner.os }}-${{ needs.revision.outputs.sha }}
          path: target/release/bundle
          if-no-files-found: error
