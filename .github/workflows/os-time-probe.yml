# Temporary #162/#154 evidence; removed before merge. Prints the Windows output of the
# close-in-service regression and repeats the shutdown races above the CPU count.
name: OS time probe
on:
  push:
    branches: [fix/os-suite-shutdown-timing]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - uses: ./.github/actions/native-analysis-compiler
      - name: Repeat shutdown races
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          @'
          import json, os, subprocess, sys, tempfile, time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/python/native').resolve()))
          import os_suites
          cases = [('controlled_time.c', 'close-in-service', 7, 'trace=ISREZ '),
                   ('controlled_time.c', 'close-before-pending', 7, 'trace=ISREZ '),
                   ('source_repetition.c', 'isr-enable-false', 0, 'trace=PpD reason=0')]
          binaries = {}
          for harness in {case[0] for case in cases}:
              work = Path(tempfile.mkdtemp())
              with os_suites.host_target(), os_suites.native_session(work, 'probe'):
                  binaries[harness] = str(os_suites.build(work, harness)[0])
          with os_suites.host_target(), os_suites.native_session(Path(tempfile.mkdtemp()), 'probe'):
              print(json.dumps(os_suites.execute(Path(binaries['controlled_time.c']), 'close-in-service'), indent=2), flush=True)
          jobs = 3 * os.cpu_count()
          def once(binary, scenario):
              try:
                  r = subprocess.run([binary, scenario], capture_output=True, text=True, timeout=30)
                  return r.returncode, r.stdout.strip()
              except subprocess.TimeoutExpired:
                  return 'timeout', ''
          for harness, scenario, code, marker in cases:
              with ThreadPoolExecutor(jobs) as pool:
                  results = list(pool.map(lambda _: once(binaries[harness], scenario), range(6000)))
              odd = [r for r in results if r[0] != code or marker not in r[1]]
              print(f'{scenario} runs=6000 jobs={jobs} odd={len(odd)}', flush=True)
              for status, out in odd:
                  print(f'ODD exit={status} {out.splitlines()[-1] if out else ""}', flush=True)
          '@ | uv run --locked python -
