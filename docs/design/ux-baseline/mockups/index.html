<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>产品界面基线 · Classic CAN 配置工作台</title>
    <style>
      :root {
        color-scheme: light;
        --shell: #f3f3f3;
        --canvas: #ffffff;
        --surface: #fafafa;
        --hover: #e9e9e9;
        --line: #dddddd;
        --text-primary: #252525;
        --text-secondary: #626262;
        --text-muted: #6b6b6b;
        --primary: #b64c55;
        --primary-text: #ffffff;
        --selection: #e6effc;
        --selection-text: #1c4b86;
        --blue: #285f9e;
        --teal: #146c63;
        --purple: #7953a5;
        --gold: #856016;
        --success: #257447;
        --warning: #8c620f;
        --error: #b23936;
        --error-bg: #fceeed;
        --warning-bg: #fff5dd;
        --success-bg: #eaf5ed;
        --font-ui:
          'Segoe UI Variable', 'Segoe UI', 'Microsoft YaHei', sans-serif;
        --font-code: 'Cascadia Code', Consolas, 'Courier New', monospace;
        --radius: 5px;
        --panel: 16px;
        --gap: 8px;
        --motion: 140ms;
        font-family: var(--font-ui);
        font-size: 13px;
        color: var(--text-primary);
        background: var(--shell);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --shell: #1b1b1b;
        --canvas: #232323;
        --surface: #202020;
        --hover: #303030;
        --line: #3d3d3d;
        --text-primary: #ededed;
        --text-secondary: #b4b4b4;
        --text-muted: #a1a1a1;
        --primary: #ff979f;
        --primary-text: #491f29;
        --selection: #263e5a;
        --selection-text: #c4dbfa;
        --blue: #97bcef;
        --teal: #8fd2c5;
        --purple: #c0a4e6;
        --gold: #e2c077;
        --success: #91cea4;
        --warning: #e5c27e;
        --error: #eeaaa4;
        --error-bg: #3b2827;
        --warning-bg: #393224;
        --success-bg: #25352b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: inherit;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius);
        cursor: pointer;
        min-height: 30px;
        padding: 5px 10px;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      button:disabled {
        color: var(--text-muted);
        cursor: not-allowed;
        opacity: 0.65;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        background: var(--canvas);
        color: var(--text-primary);
        border-radius: var(--radius);
        caret-color: var(--primary);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--text-muted);
      }
      input:disabled,
      select:disabled {
        background: var(--shell);
        color: var(--text-secondary);
      }
      input[type='checkbox'] {
        width: auto;
        accent-color: var(--primary);
      }
      ::selection {
        color: var(--selection-text);
        background: var(--selection);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      a {
        color: var(--blue);
        text-underline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      svg.icon {
        width: 17px;
        height: 17px;
        flex: 0 0 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .mono {
        font-family: var(--font-code);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .muted,
      .hint {
        color: var(--text-secondary);
      }
      .hint {
        font-size: 12px;
        line-height: 1.6;
      }
      .primary {
        background: var(--primary);
        color: var(--primary-text);
        border-color: transparent;
        font-weight: 600;
      }
      .primary:hover:not(:disabled) {
        background: var(--primary);
        filter: brightness(0.93);
      }
      .primary:disabled {
        background: var(--hover);
        color: var(--text-muted);
        filter: none;
      }
      .secondary {
        border-color: var(--line);
        background: var(--canvas);
      }
      .text-button {
        color: var(--blue);
        padding: 2px 4px;
      }
      .icon-button {
        width: 30px;
        padding: 4px;
      }
      .icon-button[aria-pressed='true'] {
        color: var(--selection-text);
        background: var(--selection);
      }
      .role-tag,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        line-height: 20px;
        padding: 0 6px;
        border-radius: 3px;
        background: var(--shell);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .tag.blue,
      .role-blue {
        color: var(--blue);
      }
      .tag.teal,
      .role-teal {
        color: var(--teal);
      }
      .tag.purple,
      .role-purple {
        color: var(--purple);
      }
      .tag.gold,
      .role-gold {
        color: var(--gold);
      }
      .success {
        color: var(--success);
      }
      .warning {
        color: var(--warning);
      }
      .error {
        color: var(--error);
      }
      .prototype-bar {
        height: 32px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        color: var(--text-secondary);
        font-size: 11px;
        background: var(--canvas);
      }
      .prototype-bar strong {
        color: var(--text-primary);
        font-weight: 600;
      }
      .prototype-bar select {
        width: 150px;
        height: 24px;
        padding: 1px 6px;
        font-size: 11px;
        margin-left: auto;
      }
      .window {
        height: calc(100dvh - 32px);
        min-height: 560px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .menu-bar {
        height: 34px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 4px;
        background: var(--shell);
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 5;
      }
      .brand {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-right: 15px;
        font-size: 12px;
        font-weight: 600;
      }
      .logo {
        width: 23px;
        height: 23px;
        flex-shrink: 0;
      }
      .menu-button {
        min-height: 26px;
        padding: 3px 8px;
        font-size: 12px;
      }
      .menu-button[aria-expanded='true'] {
        background: var(--hover);
      }
      .window-label {
        margin-left: auto;
        color: var(--text-muted);
        font-size: 11px;
      }
      .toolbar {
        height: 48px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 14px;
        background: var(--canvas);
      }
      .project-select {
        justify-content: flex-start;
        width: 230px;
        font-weight: 600;
        padding-left: 4px;
      }
      .project-select .icon {
        color: var(--blue);
      }
      .project-select small {
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 400;
      }
      .separator {
        height: 20px;
        width: 1px;
        background: var(--line);
        margin: 0 5px;
        flex-shrink: 0;
      }
      .toolbar-search {
        margin-left: auto;
        color: var(--text-muted);
        font-size: 12px;
        min-width: 145px;
        justify-content: space-between;
      }
      kbd {
        font-family: var(--font-ui);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 10px;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .utility-rail {
        width: 42px;
        flex-shrink: 0;
        background: var(--shell);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 0;
        gap: 10px;
      }
      .utility-rail .bottom {
        margin-top: auto;
      }
      .project-panel {
        width: 250px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 38px;
        padding: 0 12px;
        font-weight: 600;
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      .project-filter {
        padding: 10px 12px;
      }
      .project-filter input {
        font-size: 12px;
        height: 30px;
        background: var(--canvas);
      }
      .sub-tabs {
        display: flex;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 0 12px;
      }
      .sub-tabs button {
        border-radius: 0;
        padding: 5px 0 8px;
        font-size: 12px;
        color: var(--text-secondary);
        border-bottom: 2px solid transparent;
      }
      .sub-tabs button.active {
        color: var(--text-primary);
        border-bottom-color: var(--primary);
      }
      .tree-content {
        overflow: auto;
        padding: 10px 7px;
        flex: 1;
      }
      .tree-node {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 30px;
        gap: 7px;
        padding: 4px 6px;
        text-align: left;
        font-size: 12px;
      }
      .tree-node span.name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-node .tail {
        margin-left: auto;
        color: var(--text-muted);
        font-size: 10px;
      }
      .tree-node.selected {
        background: var(--selection);
        color: var(--selection-text);
      }
      .tree-node.level-1 {
        padding-left: 18px;
      }
      .tree-node.level-2 {
        padding-left: 37px;
      }
      .tree-node.level-3 {
        padding-left: 56px;
      }
      .tree-group {
        color: var(--text-secondary);
      }
      .tree-foot {
        border-top: 1px solid var(--line);
        padding: 9px 12px;
        display: flex;
        justify-content: space-between;
        color: var(--text-secondary);
        font-size: 11px;
      }
      .central {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--canvas);
      }
      .editors {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .document {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .editor-tabs {
        display: flex;
        min-height: 39px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        flex-shrink: 0;
      }
      .editor-tab {
        display: flex;
        align-items: center;
        border-right: 1px solid var(--line);
        position: relative;
        flex-shrink: 0;
      }
      .editor-tab button {
        border-radius: 0;
        min-height: 38px;
        font-size: 12px;
        color: var(--text-secondary);
        padding: 7px 13px;
      }
      .editor-tab.active {
        background: var(--canvas);
        box-shadow: inset 0 -2px var(--primary);
      }
      .editor-tab.active button {
        color: var(--text-primary);
      }
      .editor-tab .tab-close {
        padding: 4px;
        margin-right: 5px;
        min-height: 24px;
      }
      .editor-tab .tab-close .icon {
        width: 12px;
        height: 12px;
      }
      .breadcrumb {
        min-height: 33px;
        display: flex;
        align-items: center;
        padding: 5px 20px;
        gap: 7px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--text-secondary);
        overflow: hidden;
        flex-shrink: 0;
      }
      .breadcrumb .icon {
        width: 12px;
        height: 12px;
      }
      .breadcrumb strong {
        font-weight: 500;
        color: var(--text-primary);
      }
      .editor-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px;
      }
      .content-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .content-head p {
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 6px;
        line-height: 1.6;
      }
      .content-actions {
        display: flex;
        gap: 7px;
        flex-shrink: 0;
      }
      .content-search {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
      }
      .content-search input {
        max-width: 270px;
        height: 31px;
        font-size: 12px;
      }
      .content-search .count {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      caption {
        text-align: left;
        font-weight: 600;
        padding: 15px 0 10px;
      }
      th {
        text-align: left;
        color: var(--text-secondary);
        font-weight: 500;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        background: var(--surface);
      }
      th:first-child,
      td:first-child {
        padding-left: 10px;
      }
      th button {
        min-height: 20px;
        padding: 0;
        font-size: inherit;
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      tr.selected-row td {
        background: var(--selection);
      }
      tr:hover td {
        background: var(--surface);
      }
      tr.selected-row:hover td {
        background: var(--selection);
      }
      .table-object {
        padding: 0;
        min-height: 19px;
        gap: 8px;
        font-weight: 500;
      }
      .table-object .icon {
        width: 15px;
        height: 15px;
      }
      .table-meta {
        font-size: 11px;
        color: var(--text-muted);
        padding-top: 4px;
      }
      .section-title {
        margin: 22px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .section-title small {
        font-weight: 400;
        color: var(--text-secondary);
      }
      .inspector {
        width: 290px;
        flex-shrink: 0;
        background: var(--surface);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .inspector-body {
        padding: 16px;
        overflow: auto;
        flex: 1;
      }
      .object-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 9px;
      }
      .object-title h3 {
        font-size: 15px;
      }
      .object-path {
        font-size: 11px;
        color: var(--text-secondary);
        overflow-wrap: anywhere;
        line-height: 1.6;
        margin-bottom: 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 14px;
      }
      .field span {
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .field small {
        font-size: 10px;
        font-weight: 400;
      }
      .field input,
      .field select {
        font-size: 13px;
        min-height: 32px;
      }
      .field-wide {
        grid-column: 1 / -1;
      }
      .inspector-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .inspector-footer .hint {
        width: 100%;
        font-size: 11px;
        margin-top: 2px;
      }
      .reference-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin: 7px 0;
        text-align: left;
        padding: 9px;
        background: var(--canvas);
        border-color: var(--line);
      }
      .inline-notice {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        background: var(--warning-bg);
        color: var(--warning);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.6;
        margin-bottom: 16px;
      }
      .inline-notice.error {
        background: var(--error-bg);
        color: var(--error);
      }
      .summary-line {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .summary-line .tag {
        margin-left: auto;
      }
      .summary-line strong {
        min-width: 110px;
        font-weight: 500;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
        margin-top: 18px;
        max-width: 740px;
      }
      .check-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px 0;
        font-size: 12px;
      }
      .tool-window {
        height: 210px;
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--canvas);
      }
      .tool-heading {
        height: 35px;
        flex-shrink: 0;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .tool-heading h3 {
        font-size: 12px;
      }
      .tool-heading .tool-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .tool-heading button {
        min-height: 24px;
        font-size: 11px;
        padding: 2px 6px;
      }
      .tool-body {
        overflow: auto;
        flex: 1;
        padding: 12px 16px;
      }
      .tool-body pre {
        margin: 0;
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 1.85;
        white-space: pre-wrap;
        font-family: var(--font-code);
      }
      .tool-tabs {
        display: flex;
        align-items: center;
        min-height: 32px;
        border-top: 1px solid var(--line);
        padding-left: 12px;
        background: var(--shell);
        gap: 12px;
        overflow: auto;
        flex-shrink: 0;
      }
      .tool-tabs button {
        border-radius: 0;
        min-height: 32px;
        font-size: 11px;
        color: var(--text-secondary);
        padding: 4px 6px;
        border-top: 2px solid transparent;
      }
      .tool-tabs button.active {
        color: var(--text-primary);
        border-top-color: var(--primary);
        background: var(--canvas);
      }
      .tool-count {
        font-size: 10px;
        background: var(--hover);
        min-width: 15px;
        text-align: center;
        border-radius: 3px;
      }
      .issue-row {
        display: flex;
        width: 100%;
        gap: 9px;
        justify-content: flex-start;
        padding: 9px;
        text-align: left;
        min-height: 34px;
        border-radius: 2px;
      }
      .issue-row .issue-description {
        flex: 1;
      }
      .issue-row small {
        color: var(--text-secondary);
        display: block;
        margin-top: 3px;
      }
      .issue-row .mono {
        color: var(--text-secondary);
        font-size: 10px;
      }
      .empty-result {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--text-secondary);
        padding: 16px 2px;
        font-size: 12px;
      }
      .empty-result .icon {
        color: var(--success);
      }
      .tool-form {
        display: flex;
        gap: 10px;
        align-items: end;
        margin-bottom: 12px;
      }
      .tool-form label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
        color: var(--text-secondary);
        font-size: 11px;
      }
      .tool-form input {
        height: 30px;
        font-size: 12px;
      }
      .status-bar {
        height: 27px;
        flex-shrink: 0;
        display: flex;
        align-items: center;

                message: 'VehicleSpeed 的位段与 GearPosition 重叠。',
                object: 'VehicleSpeed',
                file: 'ComCfg.arxml',
              },
            ];
            S.data[1].signals[0].length = 24;
          }
          if (name === 'external') {
            S.external = true;
            invalidate(['validate', 'generate', 'preflight', 'build', 'run']);
            S.notice =
              'ComCfg.arxml 已在工作台之外修改。请重新导入完整来源集合。';
          }
          if (name === 'cross') {
            S.target = 'linux';
            S.view = 'delivery';
            S.tool = 'build';
          }
          selectionForm();
          $('#scenario').value = name;
          render();
        }
        function action(name, value) {
          if (name === 'tree-group') {
            S.collapsedGroups = S.collapsedGroups.includes(value)
              ? S.collapsedGroups.filter((item) => item !== value)
              : [...S.collapsedGroups, value];
            render();
            return;
          }
          if (name !== 'menu' && name !== 'project-menu') S.menu = null;
          if (name === 'menu') {
            S.menu = S.menu === value ? null : value;
            render();
            return;
          }
          if (name === 'project-menu') {
            S.menu = S.menu === 'project' ? null : 'project';
            render();
            return;
          }
          if (name === 'close-dialog') {
            closeDialog();
            return;
          }
          if (name === 'settings') {
            S.settingsTab = 'appearance';
            openDialog('settings');
            return;
          }
          if (name === 'settings-tab') {
            S.settingsTab = value;
            render();
            return;
          }
          if (name === 'settings-save') {
            const patch = window.PrototypeSettings.save(S, value);
            if (patch.resources || patch.tools) cancel();
            Object.assign(S, patch);
            if (patch.resources)
              invalidate(['validate', 'generate', 'preflight', 'build', 'run']);
            if (patch.tools)
              invalidate(['generate', 'preflight', 'build', 'run']);
            render();
            return;
          }
          if (name === 'browse-setting') {
            const samples = {
              xsd: 'C:\\AUTOSAR\\R24-11\\XSD.zip',
              mod: 'C:\\AUTOSAR\\R24-11\\MOD.zip',
              compiler: 'C:\\Tools\\gcc.exe',
              objdump: 'C:\\Tools\\objdump.exe',
              git: 'C:\\Tools\\git.exe',
              python: 'C:\\Tools\\python.exe',
            };
            S.settingsDraft = window.PrototypeSettings.change(
              S,
              value,
              samples[value],
            );
            render();
            return;
          }
          if (name === 'theme-toggle') {
            S.theme =
              document.documentElement.dataset.theme === 'dark'
                ? 'light'
                : 'dark';
            render();
            return;
          }
          if (name === 'tree-toggle') {
            S.showTree = !S.showTree;
            render();
            return;
          }
          if (name === 'inspector-toggle') {
            S.showInspector = !S.showInspector;
            render();
            return;
          }
          if (name === 'tree-mode') {
            S.treeMode = value;
            render();
            return;
          }
          if (name === 'inspector-tab') {
            S.inspectorTab = value;
            render();
            return;
          }
          if (name === 'sort') {
            S.ascending = S.sort === value ? !S.ascending : true;
            S.sort = value;
            render();
            return;
          }
          if (name === 'select' || name === 'source') {
            navigate(name, value);
            return;
          }
          if (name === 'view') {
            navigate('view', value);
            return;
          }
          if (['can', 'inputs', 'diagnostic', 'delivery'].includes(name)) {
            navigate('view', name);
            return;
          }
          if (name === 'dtc') {
            S.diagnosticTab = 'dtc';
            navigate('view', 'diagnostic');
            return;
          }
          if (name === 'diagnostic-tab') {
            S.diagnosticTab = value;
            render();
            return;
          }
          if (name === 'close-tab') {
            if (S.draft && S.view === value) {
              S.pendingNavigation = { action: 'close-tab', value };
              openDialog('discard');
              return;
            }
            navigateNow('close-tab', value);
            return;
          }
          if (name === 'tool' || name.endsWith('-tool')) {
            const key = name === 'tool' ? value : name.replace('-tool', '');
            S.tool = S.tool === key ? null : key;
            render();
            return;
          }
          if (name === 'tool-close') {
            S.tool = null;
            render();
            $('#work-area')?.focus();
            return;
          }
          if (
            name === 'apply' ||
            name === 'apply-diagnostic' ||
            name === 'apply-standard'
          ) {
            if (
              name === 'apply-diagnostic' &&
              (!S.diagnosticEnabled ||
                (S.diagnosticTab === 'dtc' && !S.dtcEnabled))
            ) {
              S.draft = true;
              S.draftContext = 'diagnostic';
            }
            apply();
            return;
          }
          if (name === 'restore') {
            S.draft = false;
            S.draftContext = null;
            S.parameterDraft = {};
            S.optionDraft = {};
            S.didSignalDraft = null;
            S.notice = '未应用草稿已还原。';
            selectionForm();
            render();
            return;
          }
          if (name === 'discard-switch' || name === 'apply-switch') {
            const next = S.pendingNavigation;
            if (name === 'apply-switch' && !apply()) return;
            S.draft = false;
            S.draftContext = null;
            S.parameterDraft = {};
            S.optionDraft = {};
            S.didSignalDraft = null;
            S.dialog = null;
            selectionForm();
            navigateNow(next.action, next.value);
            return;
          }
          if (name === 'save') {
            if (S.draft || !S.dirty || S.external) return;
            openDialog('save');
            return;
          }
          if (name === 'confirm-save') {
            S.dirty = false;
            S.savedRevision = S.revision;
            S.savedData = structuredClone(S.data);
            S.dialog = null;
            S.notice = 'ARXML 保存完成（演示），请校验当前配置。';
            log('确认保存输入修订 ' + S.savedRevision + '。');
            if (S.pendingProjectAction) {
              const next = S.pendingProjectAction;
              S.pendingProjectAction = null;
              openDialog(next);
            } else render();
            return;
          }
          if (name === 'preview-unchanged') {
            S.previewUnchanged = value;
            render();
            return;
          }
          if (name === 'validate' || name === 'inspect') {
            if (S.draft || !S.resources.ready) return;
            S.tool = 'problems';
            runStage('validate');
            return;
          }
          if (name === 'generate-preview') {
            if (!canGenerate()) {
              S.notice = '先应用草稿、保存并完成配置校验。';
              render();
              return;
            }
            S.tool = 'generation';
            openDialog('generate');
            return;
          }
          if (name === 'preview-file') {
            S.previewFile = value;
            render();
            return;
          }
          if (name === 'confirm-generate') {
            if (!canGenerate()) return;
            S.dialog = null;
            S.tool = 'generation';
            runStage('generate');
            return;
          }
          if (name === 'preflight') {
            if (S.profile === 'standard' && canExecute()) runStage('preflight');
            return;
          }
          if (name === 'build') {
            if (!canExecute() || S.stages.generate !== 'done') return;
            S.tool = 'build';
            invalidate(['build', 'run']);
            runStage('build');
            return;
          }
          if (name === 'run' || name === 'run-diagnostic') {
            if (!canExecute() || S.stages.build !== 'done') return;
            S.runKind =
              S.profile === 'standard'
                ? 'standard'
                : name === 'run-diagnostic'
                  ? 'diagnostic'
                  : 'signal';
            S.runResults[S.runKind] = 'running';
            S.tool = 'run';
            runStage('run');
            return;
          }
          if (name === 'cancel') {
            cancel();
            return;
          }
          if (name === 'locate-issue') {
            S.treeQuery = '';
            S.objectQuery = '';
            S.collapsedGroups = [];
            S.showTree = innerWidth >= 700;
            navigate('select', value);
            return;
          }
          if (
            name === 'did-add' ||
            name === 'did-remove' ||
            name === 'did-up' ||
            name === 'did-down'
          ) {
            const list = [...(S.didSignalDraft ?? S.didSignals)],
              index = Number(value);
            if (name === 'did-add') list.push($('#did-candidate').value);
            if (name === 'did-remove') list.splice(index, 1);
            if (name === 'did-up')
              [list[index - 1], list[index]] = [list[index], list[index - 1]];
            if (name === 'did-down')
              [list[index + 1], list[index]] = [list[index], list[index + 1]];
            S.didSignalDraft = list;
            S.draft = true;
            S.draftContext = 'diagnostic';
            render();
            return;
          }
          if (name === 'remove-diagnostic') {
            openDialog('remove-diagnostic');
            return;
          }
          if (name === 'confirm-remove') {
            if (S.diagnosticTab === 'dtc') S.dtcEnabled = false;
            else {
              S.diagnosticEnabled = false;
              S.dtcEnabled = false;
            }
            S.dialog = null;
            S.draft = false;
            S.dirty = true;
            S.revision++;
            invalidate(['validate', 'generate', 'preflight', 'build', 'run']);
            S.notice = '配置已移除（演示），尚未保存。';
            render();
            return;
          }
          if (name === 'reimport') {
            S.external = false;
            S.notice = '来源集合已重新导入（演示），旧交付结果保持失效。';
            S.stages.validate = 'pending';
            log('重新导入来源，不复用旧结果。');
            render();
            return;
          }
          if (name === 'notice-close') {
            S.notice = '';
            render();
            return;
          }
          if (
            [
              'new',
              'import',
              'import-handoff',
              'add-frame',
              'add-signal',
              'command',
              'guide',
              'about',
            ].includes(name)
          ) {
            if (
              (name === 'add-frame' || name === 'add-signal') &&
              (S.profile === 'standard' || S.busy)
            )
              return;
            if (
              ['new', 'import', 'import-handoff'].includes(name) &&
              S.opened &&
              (S.draft || S.dirty)
            ) {
              S.pendingProjectAction = name;
              openDialog('switch-project');
              return;
            }
            if ((name === 'add-frame' || name === 'add-signal') && S.draft) {
              S.pendingNavigation = { action: 'create', value: name };
              openDialog('discard');
              return;
            }
            openDialog(name);
            return;
          }
          if (name === 'discard-open') {
            const next = S.pendingProjectAction;
            S.pendingProjectAction = null;
            S.draft = false;
            S.dirty = false;
            S.parameterDraft = {};
            S.optionDraft = {};
            openDialog(next);
            return;
          }
          if (name === 'save-before-open') {
            if (S.draft && !apply()) return;
            openDialog('save');
            return;
          }
          if (name === 'command-run') {
            S.dialog = null;
            action(value);
            return;
          }
          if (name === 'confirm-create') {
            const form = new FormData($('#prototype-form'));
            const text = String(form.get('name') || '').trim();
            if (!text) {
              S.notice = '名称或路径不能为空。';
              render();
              return;
            }
            if (S.dialog === 'add-frame') {
              const id = Number(form.get('canid'));
              if (
                !Number.isInteger(id) ||
                id < 0 ||
                id > 2047 ||
                S.data.some((f) => Number(f.id) === id) ||
                S.data.some((f) => f.name === text)
              ) {
                S.notice =
                  '名称或 CAN ID 与现有帧冲突，或 ID 不在 0–2047 范围。';
                render();
                return;
              }
              S.data.push({
                name: text,
                id: '0x' + id.toString(16).toUpperCase(),
                dlc: 8,
                direction: 'Tx',
                time: 20,
                signals: [],
              });
              S.selected = text;
              S.dirty = true;
              S.revision++;
              invalidate(['validate', 'generate', 'preflight', 'build', 'run']);
            } else if (S.dialog === 'add-signal') {
              const f = selectedFrame();
              if (!f) return;
              const bit = f.signals.reduce(
                (max, s) => Math.max(max, s.bit + s.length),
                0,
              );
              if (
                bit + 8 > f.dlc * 8 ||
                S.data.some((f) => f.signals.some((s) => s.name === text))
              ) {
                S.notice = '该帧无足够连续空间，或信号名称已存在。';
                render();
                return;
              }
              f.signals.push({ name: text, bit, length: 8, value: 0 });
              S.selected = text;
              S.dirty = true;
              S.revision++;
              invalidate(['validate', 'generate', 'preflight', 'build', 'run']);
            } else {
              const wasNew = S.dialog === 'new';
              scenario(wasNew ? 'empty' : 'default');
              S.opened = true;
              if (wasNew) S.projectName = text;
              log(
                wasNew
                  ? '创建新的空工程（演示）。'
                  : '导入完整来源集合（演示，不读取路径）。',
              );
            }
            S.dialog = null;
            selectionForm();
            render();
            return;
          }
          if (name === 'open-can') {
            scenario('default');
            return;
          }
          if (name === 'open-standard') {
            scenario('standard');
            return;
          }
          if (name === 'welcome' || name === 'close-project') {
            if (S.draft) {
              S.pendingNavigation = { action: 'welcome', value: 'can' };
              openDialog('discard');
              return;
            }
            openDialog('close-project');
            return;
          }
          if (name === 'confirm-close') {
            S.opened = false;
            S.dirty = false;
            S.draft = false;
            S.dialog = null;
            S.logs = [];
            S.stages = {
              validate: 'pending',
              generate: 'pending',
              preflight: 'pending',
              build: 'pending',
              run: 'pending',
            };
            render();
            return;
          }
        }
        document.addEventListener('click', (event) => {
          const btn = event.target.closest('button[data-action]');
          if (btn && !btn.disabled) {
            action(btn.dataset.action, btn.dataset.value);
            return;
          }
          if (S.menu && !event.target.closest('.popup-menu')) {
            S.menu = null;
            render();
          }
        });
        document.addEventListener('input', (event) => {
          const el = event.target;
          if (el.dataset.edit && el.tagName !== 'SELECT') {
            S.draft = true;
            S.draftContext = S.view;
            if (Object.hasOwn(S.parameters, el.dataset.edit))
              S.parameterDraft[el.dataset.edit] = el.value;
            else S.form[el.dataset.edit] = el.value;
            render();
          }
          if (el.dataset.setting) {
            S.settingsDraft = window.PrototypeSettings.change(
              S,
              el.dataset.setting,
              el.value,
            );
            return;
          }
          if (el.dataset.field && el.tagName !== 'SELECT') {
            S[el.dataset.field] = el.value;
            if (el.dataset.field === 'output')
              invalidate(['generate', 'preflight', 'build', 'run']);
            if (el.dataset.field === 'buildDir') invalidate(['build', 'run']);
            if (
              ['treeQuery', 'objectQuery', 'commandQuery'].includes(
                el.dataset.field,
              )
            )
              render();
          }
        });
        document.addEventListener('change', (event) => {
          const el = event.target;
          if (el.dataset.edit && el.tagName === 'SELECT') {
            S.draft = true;
            S.draftContext = S.view;
            if (Object.hasOwn(S.parameters, el.dataset.edit))
              S.parameterDraft[el.dataset.edit] = el.value;
            else S.form[el.dataset.edit] = el.value;
            render();
          }
          if (el.dataset.setting) {
            S.settingsDraft = window.PrototypeSettings.change(
              S,
              el.dataset.setting,
              el.value,
            );
            render();
          }
          if (el.dataset.option) {
            if (el.dataset.option === 'handoff') {
              S.handoff = el.checked;
              invalidate(['generate', 'preflight', 'build', 'run']);
            } else {
              S.optionDraft[el.dataset.option] = el.checked;
              if (el.dataset.option === 'writeDid' && !el.checked)
                S.optionDraft.routine = false;
              S.draft = true;
              S.draftContext = 'diagnostic';
            }
            render();
          }
          if (el.dataset.field === 'target') {
            cancel();
            S.target = el.value;
            invalidate(['generate', 'preflight', 'build', 'run']);
            S.notice = '目标已切换；此前目标的结果不再有效。';
            render();
          }
        });
        document.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (
            (event.ctrlKey || event.metaKey) &&
            ['k', 's', 'o'].includes(key)
          ) {
            event.preventDefault();
            action(key === 'k' ? 'command' : key === 's' ? 'save' : 'import');
            return;
          }
          if (event.altKey && ['1', '4', '9'].includes(key)) {
            event.preventDefault();
            action(
              key === '1'
                ? 'tree-toggle'
                : key === '4'
                  ? 'build-tool'
                  : 'run-tool',
            );
            return;
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            if (S.dialog) closeDialog();
            else if (S.menu) {
              S.menu = null;
              render();
            } else if (S.tool) {
              S.tool = null;
              render();
              $('#work-area')?.focus();
            }
          }
          if (S.menu && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
            event.preventDefault();
            const list = [
              ...document.querySelectorAll('.popup-menu button:not(:disabled)'),
            ];
            const i = list.indexOf(document.activeElement);
            list[
              (i + (event.key === 'ArrowDown' ? 1 : -1) + list.length) %
                list.length
            ]?.focus();
          }
          if (
            event.target.matches('[role="treeitem"]') &&
            ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(
              event.key,
            )
          ) {
            event.preventDefault();
            const nodes = [
                ...document.querySelectorAll('.tree-content [role="treeitem"]'),
              ],
              index = nodes.indexOf(event.target);
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp')
              nodes[
                Math.max(
                  0,
                  Math.min(
                    nodes.length - 1,
                    index + (event.key === 'ArrowDown' ? 1 : -1),
                  ),
                )
              ]?.focus();
            else if (event.target.dataset.action === 'tree-group') {
              const value = event.target.dataset.value,
                expanded =
                  event.target.getAttribute('aria-expanded') === 'true';
              if (
                (event.key === 'ArrowRight' && !expanded) ||
                (event.key === 'ArrowLeft' && expanded)
              )
                action('tree-group', value);
              document
                .querySelector(
                  `[data-action="tree-group"][data-value="${value}"]`,
                )
                ?.focus();
            }
          }
        });
        $('#modal').addEventListener('cancel', (event) => {
          event.preventDefault();
          closeDialog();
        });
        $('#scenario').addEventListener('change', (event) =>
          scenario(event.target.value),
        );
        matchMedia('(prefers-color-scheme: dark)').addEventListener(
          'change',
          () => {
            if (S.theme === 'system') applyTheme();
          },
        );
        Object.defineProperty(window, 'prototypeState', {
          get: () => structuredClone(S),
        });
        scenario(params.get('scene') || 'default');
      })();
    </script>
  </body>
</html>
