<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CP 配置工作区 · 交互决策草稿</title>
  <style>
    :root { color-scheme: dark; --bg:#10171b; --pane:#172126; --pane2:#1d292e; --line:#344249; --text:#edf4f2; --muted:#a2b0b0; --accent:#79d4c5; --warn:#e6bc72; --danger:#e39797; --mono:"Cascadia Code",Consolas,monospace; font-family:"Segoe UI Variable","Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); min-width:320px; }
    button { font:inherit; color:inherit; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .shell { min-height:100vh; padding-bottom:94px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:19px 30px; border-bottom:1px solid var(--line); background:#121d20; }
    .mark { display:flex; align-items:center; gap:15px; font-weight:670; font-size:19px; letter-spacing:-.03em; white-space:nowrap; }
    .mark::before { content:""; width:23px; height:23px; border:2px solid var(--accent); border-radius:5px; transform:rotate(-12deg); box-shadow:inset 0 0 0 5px #142326; }
    .path { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .top-right { display:flex; align-items:center; gap:14px; white-space:nowrap; font-size:12px; color:var(--muted); }
    .target { color:var(--accent); border:1px solid #39736c; padding:6px 10px; border-radius:5px; }
    .notice { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:12px 30px; background:#1a2729; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .notice strong { color:var(--warn); font-weight:650; }
    .scenario { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
    .scenario-label { margin-right:4px; color:#ccd8d7; }
    .chip { border:1px solid var(--line); background:transparent; border-radius:5px; padding:6px 10px; font-size:12px; }
    .chip.active { color:#0b2422; background:var(--accent); border-color:var(--accent); font-weight:700; }
    .workspace { max-width:1720px; margin:0 auto; padding:30px; }
    .intro { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:25px; }
    .eyebrow { color:var(--accent); font:11px var(--mono); letter-spacing:.13em; text-transform:uppercase; margin:0 0 8px; }
    h1 { font-size:31px; line-height:1.1; letter-spacing:-.045em; margin:0; font-weight:670; }
    .subtitle { color:var(--muted); margin:10px 0 0; font-size:14px; }
    .actions { display:flex; gap:8px; align-items:center; }
    .action { background:transparent; border:1px solid #597076; padding:10px 14px; border-radius:5px; font-size:13px; white-space:nowrap; }
    .action.primary { background:var(--accent); color:#092624; border-color:var(--accent); font-weight:700; }
    .action:hover,.chip:hover { border-color:var(--accent); }
    .grid { display:grid; min-height:570px; gap:1px; background:var(--line); border:1px solid var(--line); overflow:hidden; }
    .grid > * { background:var(--pane); min-width:0; }
    .a-grid { grid-template-columns:250px minmax(440px,1fr) 330px; }
    .pane { padding:21px; }
    .pane.tight { padding:14px 0; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; margin:0 0 18px; color:#c4d3d0; font-size:12px; font-weight:720; letter-spacing:.055em; text-transform:uppercase; }
    .dim { color:var(--muted); }
    .tree-group { padding:11px 14px 6px; color:var(--muted); font-size:11px; letter-spacing:.1em; }
    .tree-item { display:flex; justify-content:space-between; padding:9px 16px 9px 23px; font-size:13px; border-left:3px solid transparent; }
    .tree-item.active { border-left-color:var(--accent); background:#223539; color:var(--text); }
    .tree-item small { color:var(--muted); font:11px var(--mono); }
    .tree-item.warn small { color:var(--warn); }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); }
    .toolbar h2 { margin:0; font-size:17px; font-weight:650; }
    .toolbar span { font:12px var(--mono); color:var(--muted); }
    .table { width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
    .table th { padding:14px 17px; font-size:11px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); }
    .table td { padding:16px 17px; border-bottom:1px solid #2c3a40; }
    .table tr.selected td { background:#223539; }
    .table .mono { font:12px var(--mono); color:#bdd6d1; }
    .hint { padding:19px 22px; color:var(--muted); font-size:12px; line-height:1.65; }
    .field { margin:0 0 21px; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:8px; }
    .field .value { font:13px var(--mono); background:#111c20; padding:11px; border:1px solid var(--line); border-radius:4px; }
    .field .value.locked { color:var(--warn); }
    .inspector-note { border-left:2px solid var(--accent); padding:8px 11px; color:var(--muted); line-height:1.55; font-size:12px; }
    .lower { display:grid; grid-template-columns:1fr 330px; gap:1px; background:var(--line); border:1px solid var(--line); border-top:0; }
    .lower > * { background:#151f23; padding:15px 20px; }
    .summary { display:flex; flex-wrap:wrap; gap:22px; align-items:center; font-size:12px; color:var(--muted); }
    .summary strong { font:12px var(--mono); color:var(--text); }
    .status { border-left:3px solid var(--accent); background:#18302f; padding:14px 18px; margin-top:18px; font-size:13px; line-height:1.55; }
    .status.warn { border-left-color:var(--warn); background:#30291e; }
    .status.danger { border-left-color:var(--danger); background:#322324; }
    .status b { display:block; margin-bottom:4px; }
    .status p { margin:0; color:#ccdbd7; }
    .status code { font:12px var(--mono); }
    .b-layout { display:grid; grid-template-columns:265px minmax(440px,1fr) 300px; gap:22px; }
    .b-steps { border-top:1px solid var(--line); padding-top:10px; }
    .step { display:flex; gap:14px; padding:18px 4px; border-bottom:1px solid var(--line); }
    .step-index { color:var(--accent); font:12px var(--mono); }
    .step strong { display:block; font-size:14px; }
    .step small { display:block; color:var(--muted); margin-top:5px; font-size:12px; }
    .step.active { color:var(--accent); }
    .b-main { border:1px solid var(--line); background:var(--pane); min-height:570px; padding:27px 31px; }
    .b-main h2 { font-size:25px; margin:0 0 9px; letter-spacing:-.035em; }
    .b-main > p { color:var(--muted); font-size:13px; margin:0 0 17px; }
    .b-options { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .choice { min-height:105px; padding:16px; border:1px solid var(--line); background:#18282b; }
    .choice.selected { border-color:var(--accent); }
    .choice strong { display:block; margin:10px 0; font-size:16px; }
    .choice span { display:block; color:var(--muted); font-size:12px; line-height:1.5; }
    .b-sub { border-top:1px solid var(--line); margin-top:18px; padding-top:14px; }
    .b-sub h3 { font-size:13px; margin:0 0 14px; }
    .row { display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid #2b383d; font-size:13px; }
    .row span:last-child { font:12px var(--mono); color:#bed4d1; }
    .b-aside { border-top:1px solid var(--line); padding-top:20px; }
    .b-aside h3 { margin:0 0 14px; font-size:13px; }
    .file { padding:11px 0; border-bottom:1px solid var(--line); font:11px var(--mono); color:#d9e7e3; overflow:hidden; text-overflow:ellipsis; }
    .file small { display:block; color:var(--muted); font:11px "Segoe UI",sans-serif; margin-top:5px; }
    .c-layout { display:grid; grid-template-columns:230px minmax(500px,1fr) 290px; gap:19px; }
    .c-side { border-top:1px solid var(--line); padding:18px 0; }
    .c-side .tree-item { border-radius:3px; }
    .graph { min-height:570px; background:#152226; border:1px solid var(--line); position:relative; overflow:hidden; padding:25px; background-image:linear-gradient(#24323766 1px,transparent 1px),linear-gradient(90deg,#24323766 1px,transparent 1px); background-size:29px 29px; }
    .graph-head { display:flex; justify-content:space-between; align-items:start; }
    .graph h2 { margin:0; font-size:19px; }
    .graph p { margin:7px 0 0; color:var(--muted); font-size:12px; }
    .flow { margin:84px 4px 60px; display:flex; align-items:center; justify-content:center; gap:7px; }
    .node { width:97px; flex:none; padding:16px 8px; background:#203136; border:1px solid #527173; text-align:center; font:12px var(--mono); }
    .node.emphasis { background:#24504c; border-color:var(--accent); }
    .node small { display:block; color:var(--muted); font:10px "Segoe UI",sans-serif; margin-top:7px; }
    .arrow { height:1px; width:17px; flex:none; background:var(--accent); position:relative; }
    .arrow::after { content:""; position:absolute; right:-1px; top:-3px; width:6px; height:6px; border-top:1px solid var(--accent); border-right:1px solid var(--accent); transform:rotate(45deg); }
    .trace { padding:16px 20px; border-top:1px solid var(--line); background:#17282c; font:12px var(--mono); line-height:2; }
    .trace .dim { font-family:"Segoe UI",sans-serif; }
    .c-inspector { border:1px solid var(--line); background:var(--pane); padding:21px; }
    .prototype-switcher { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:13px; z-index:10; padding:8px; border-radius:10px; background:#ecf4ef; color:#17302e; box-shadow:0 16px 45px #0008; white-space:nowrap; }
    .prototype-switcher button { border:0; border-radius:6px; padding:9px 13px; background:#d2e6dd; color:#17302e; font-weight:700; }
    .prototype-switcher .current { min-width:164px; text-align:center; font-size:12px; font-weight:690; }
    .prototype-switcher .proto { color:#51706d; font:10px var(--mono); }
    @media (max-width:1180px) { .a-grid,.b-layout,.c-layout { grid-template-columns:200px minmax(340px,1fr); } .a-grid > :last-child,.b-aside,.c-inspector { grid-column:2; } .flow { overflow:auto; justify-content:flex-start; } }
    @media (max-width:720px) { .top,.notice,.intro { align-items:flex-start; flex-direction:column; } .top,.notice { padding:16px; } .workspace { padding:18px; } .a-grid,.b-layout,.c-layout,.lower { display:block; } .grid > *, .b-main,.c-inspector { min-height:auto; margin-bottom:1px; } .b-options { grid-template-columns:1fr; } .flow { margin:35px 0; } h1 { font-size:26px; } .top-right { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    // 问题：同一份 ECU/CAN 配置，在工程树、任务向导、依赖链三种工作区中，哪一种更容易完成配置并理解失败反馈？
    const variants = ['A','B','C'];
    const names = {A:'工程树',B:'任务流程',C:'依赖链'};
    const cases = {
      clean: {label:'从空项目', files:'1 份 ARXML', retained:'无', headline:'可配置的 CAN 闭环', detail:'创建 ECU、映射信号，再生成主机虚拟目标工程。', kind:'ok'},
      imported: {label:'导入多文件', files:'4 份 ARXML', retained:'2 项只读保留', headline:'已识别跨文件引用', detail:'未支持的配置留在原文件；可编辑的 CAN 信号仍可修改。', kind:'warn'},
      unsafe: {label:'危险修改', files:'4 份 ARXML', retained:'2 项只读保留', headline:'保存会影响未知引用', detail:'修改 /BodyCAN/Frame_321/SHORT-NAME 会影响保留项；应阻止本次保存。', kind:'danger'},
      variant: {label:'未支持变体', files:'4 份 ARXML', retained:'1 个未支持变体', headline:'当前配置不能生成', detail:'CanController/Variants 的选取未受支持；保留输入，但不能假定生效分支。', kind:'danger'}
    };
    const query = new URLSearchParams(location.search);
    let variant = variants.includes(query.get('variant')) ? query.get('variant') : 'A';
    let scenario = cases[query.get('scenario')] ? query.get('scenario') : 'clean';
    let showFeedback = false;
    function scenarioButtons() { return Object.entries(cases).map(([id,value]) => `<button type="button" class="chip ${scenario===id?'active':''}" data-scenario="${id}">${value.label}</button>`).join(''); }
    function status(s) {
      const title = showFeedback ? (s.kind==='ok' ? '流程预期 · 可进入生成' : s.headline) : s.headline;
      const detail = showFeedback && s.kind==='ok' ? '界面草稿只展示预期反馈；此页面未解析 ARXML、未生成或编译代码。真实验收需另行执行。' : s.detail;
      return `<div class="status ${s.kind==='ok'?'':s.kind}" role="status"><b>${title}</b><p>${detail}</p></div>`;
    }
    function header() { return `<div class="shell"><header class="top"><div class="mark">CP 工程台 <span class="path">/ Demo_ECU / BodyCAN</span></div><div class="top-right"><span>CP / FO R24-11</span><span class="target">目标：主机虚拟 ECU</span></div></header><div class="notice"><span><strong>交互决策草稿</strong> · 示意数据；不读取文件、不保存、不生成 C 代码。</span><div class="scenario"><span class="scenario-label">查看场景</span>${scenarioButtons()}</div></div>`; }
    function intro(title,subtitle) { return `<div class="intro"><div><p class="eyebrow">WORKSPACE ${variant} / ${names[variant]}</p><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions"><button class="action" data-action="check">查看校验反馈</button><button class="action primary" data-action="generate">查看生成反馈</button></div></div>`; }
    function a(s) { return `${intro('ECU 配置','文件、模块和信号都在同一工作区；右侧直接解释当前对象。')}<div class="grid a-grid"><nav class="pane tight"><div class="tree-group">项目文件 · ${s.files}</div><div class="tree-item">▾ Demo_ECU <small>R24</small></div><div class="tree-item active">　BodyCAN <small>CAN 0</small></div><div class="tree-item">　Signals <small>12</small></div><div class="tree-group">基础软件</div><div class="tree-item">COM <small>就绪</small></div><div class="tree-item">PduR <small>就绪</small></div><div class="tree-item">CanIf <small>就绪</small></div><div class="tree-item">Can <small>虚拟</small></div><div class="tree-group">原始资料</div><div class="tree-item warn">保留项 <small>${s.retained}</small></div></nav><section><div class="toolbar"><h2>BodyCAN · 信号映射</h2><span>CAN / 500 kbit/s</span></div><table class="table"><thead><tr><th>信号</th><th>帧 ID</th><th>位位置</th><th>方向</th></tr></thead><tbody><tr class="selected"><td>VehicleSpeed</td><td class="mono">0x321</td><td class="mono">0–15</td><td>接收</td></tr><tr><td>BrakeSwitch</td><td class="mono">0x321</td><td class="mono">16</td><td>接收</td></tr><tr><td>MotorTorque</td><td class="mono">0x284</td><td class="mono">0–15</td><td>发送</td></tr></tbody></table><p class="hint">点击问题场景，比较“保留项”和不能安全保存的编辑在同一位置如何反馈。此处没有真正修改配置。</p></section><aside class="pane"><div class="panel-title">信号检查器 <span>01 / 12</span></div><div class="field"><label>SHORT-NAME</label><div class="value">VehicleSpeed</div></div><div class="field"><label>引用路径</label><div class="value">/Demo_ECU/BodyCAN/Frame_321</div></div><div class="field"><label>来源文件</label><div class="value">${scenario==='clean'?'Demo_ECU.arxml':'network/BodyCAN.arxml'}</div></div><div class="inspector-note">${scenario==='unsafe'?'该对象被保留项引用。修改名称前必须证明引用能安全更新；否则阻止保存。':'只编辑已支持字段；未认识的配置保留在原始 ARXML。'}</div>${status(s)}</aside></div><div class="lower"><div class="summary"><span>配置源 <strong>${s.files}</strong></span><span>保留项 <strong>${s.retained}</strong></span><span>目标 <strong>virtual-can</strong></span></div><div class="dim">未进行实机验证</div></div>`; }
    function b(s) { return `${intro('配置并验证一个 ECU','按任务完成导入、信号映射与虚拟运行；每一步只处理一个决策。')}<div class="b-layout"><nav class="b-steps"><div class="step"><span class="step-index">01</span><div><strong>项目来源</strong><small>空项目或多文件 ARXML</small></div></div><div class="step active"><span class="step-index">02</span><div><strong>通信配置</strong><small>CAN 帧与信号</small></div></div><div class="step"><span class="step-index">03</span><div><strong>校验与保护</strong><small>引用、保留项、变体</small></div></div><div class="step"><span class="step-index">04</span><div><strong>生成与运行</strong><small>仅主机虚拟目标</small></div></div></nav><section class="b-main"><p class="eyebrow">步骤 02 / 通信配置</p><h2>信号怎样进入 ECU？</h2><p>从一个可运行的 CAN 信号闭环开始。未支持内容不会因保存而消失。</p><div class="b-options"><div class="choice selected"><span>接收 · 0x321</span><strong>VehicleSpeed</strong><span>16 位，进入 COM，映射至应用接收端口。</span></div><div class="choice"><span>发送 · 0x284</span><strong>MotorTorque</strong><span>16 位，从应用发送端口交给虚拟 CAN。</span></div></div><div class="b-sub"><h3>当前配置</h3><div class="row"><span>网络速率</span><span>500 kbit/s</span></div><div class="row"><span>输入来源</span><span>${s.files}</span></div><div class="row"><span>无法识别的配置</span><span>${s.retained}</span></div>${status(s)}</div></section><aside class="b-aside"><h3>生成前还要确认</h3><div class="file">01 · ${scenario==='clean'?'Demo_ECU.arxml':'network/BodyCAN.arxml'}<small>本项目权威配置</small></div><div class="file">02 · CAN 配置检查<small>含跨文件引用</small></div><div class="file">03 · 主机虚拟目标<small>不是 MCU 实机工程</small></div><p class="hint" style="padding-left:0">任务导向适合从零创建；导入大型现有项目时，用户需要更快定位对象。</p></aside></div>`; }
    function c(s) { const nodes=[['应用','端口'],['RTE','映射'],['COM','信号'],['PduR','路由'],['CanIf','句柄'],['Can','虚拟']]; return `${intro('检查一条通信路径','从信号追到虚拟控制器；用依赖视图理解被保留配置阻断的修改。')}<div class="c-layout"><nav class="c-side"><div class="panel-title">通信对象 <span>12</span></div><div class="tree-item active">VehicleSpeed <small>Rx</small></div><div class="tree-item">BrakeSwitch <small>Rx</small></div><div class="tree-item">MotorTorque <small>Tx</small></div><div class="tree-group">来源文件</div><div class="tree-item">network/BodyCAN.arxml</div><div class="tree-item warn">保留项 <small>${s.retained}</small></div></nav><section class="graph"><div class="graph-head"><div><h2>VehicleSpeed / 0x321</h2><p>已选择的信号如何穿过生成工程</p></div><span class="target">仅虚拟目标</span></div><div class="flow">${nodes.map((n,i)=>`<div class="node ${i===2?'emphasis':''}">${n[0]}<small>${n[1]}</small></div>${i<nodes.length-1?'<div class="arrow"></div>':''}`).join('')}</div><div class="trace"><span class="dim">引用链</span><br>/Demo_ECU/BodyCAN/Frame_321 → /Com/VehicleSpeed → /Rte/SpeedPort</div>${status(s)}</section><aside class="c-inspector"><div class="panel-title">路径详情</div><div class="field"><label>帧 / 信号</label><div class="value">0x321 · VehicleSpeed</div></div><div class="field"><label>已读取 ARXML</label><div class="value">${s.files}</div></div><div class="field"><label>未知内容</label><div class="value ${s.kind==='ok'?'':'locked'}">${s.retained}</div></div><div class="inspector-note">${scenario==='unsafe'?'引用链之外还存在无法更新的保留项；这次名称修改不能保存。':'只有能被安全解析的路径才参与代码生成，保留项原样留在项目中。'}</div></aside></div>`; }
    function switcher() { return `<div class="prototype-switcher" aria-label="交互方案切换"><button data-nav="prev" aria-label="上一方案">←</button><div class="current"><span class="proto">仅设计比较</span><br>${variant} · ${names[variant]}</div><button data-nav="next" aria-label="下一方案">→</button></div>`; }
    function render() { document.getElementById('app').innerHTML=header()+`<section class="workspace">${({A:a,B:b,C:c})[variant](cases[scenario])}</section>`+switcher()+'</div>'; }
    function updateUrl() { const u=new URL(location.href); u.searchParams.set('variant',variant); u.searchParams.set('scenario',scenario); history.replaceState(null,'',u); }
    function cycle(n) { variant=variants[(variants.indexOf(variant)+n+variants.length)%variants.length]; showFeedback=false; updateUrl(); render(); }
    document.addEventListener('click',e=>{ const t=e.target.closest('[data-nav],[data-scenario],[data-action]'); if(!t)return; if(t.dataset.nav) cycle(t.dataset.nav==='next'?1:-1); if(t.dataset.scenario){scenario=t.dataset.scenario;showFeedback=false;updateUrl();render();} if(t.dataset.action){showFeedback=true;render();} });
    document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});
    render();
  </script>
</body>
</html>
