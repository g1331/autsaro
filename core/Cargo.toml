[package]
name = "autosar-config-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
ipc-types = ["dep:specta", "dep:specta-typescript"]
verification-metrics = []
official-oracles = []
native-tests = []

[[test]]
name = "official"
required-features = ["official-oracles"]

[[test]]
name = "native"
required-features = ["native-tests"]

[dependencies]
specta-typescript = { version = "=0.0.12", optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"], optional = true }
libxml = "0.3.21"
libc = "0.2"
parking_lot = "0.12"
roxmltree = "0.21"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[lints.clippy]
# Configured in clippy.toml and denied only by the generation and integration modules.
disallowed_methods = "allow"
disallowed_macros = "allow"
