[package]
name = "autosar-config-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
verification-metrics = []
official-oracles = []
native-tests = []

[[test]]
name = "end_to_end"
required-features = ["official-oracles"]

[[test]]
name = "native"
required-features = ["native-tests"]

[dependencies]
libxml = "0.3.21"
libc = "0.2"
parking_lot = "0.12"
roxmltree = "0.21"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
