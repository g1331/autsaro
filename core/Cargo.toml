[package]
name = "autosar-config-core"
version = "0.1.0"
edition = "2024"

[dependencies]
libxml = "0.3.21"
libc = "0.2"
parking_lot = "0.12"
roxmltree = "0.21"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
