[package]
name = "autosar-config-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "AUTOSAR Classic configuration and native source delivery workbench"
build = "build.rs"

[lib]
name = "autosar_config_desktop"

[features]
native-webdriver = ["dep:tauri-plugin-wdio-webdriver", "autosar-config-core/verification-metrics"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
autosar-config-core = { path = "../core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
