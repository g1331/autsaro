[package]
name = "autosar-config-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "AUTOSAR Classic configuration and native source delivery workbench"
build = "build.rs"

[lib]
name = "autosar_config_desktop"

[features]
native-webdriver = ["autosar-config-core/verification-metrics"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
autosar-config-core = { path = "../core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
autosar-config-core = { path = "../core", features = ["ipc-types"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
heck = "0.5"
