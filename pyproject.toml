[project]
name = "autosar-tooling"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "tools/python/src"}

[tool.setuptools.packages.find]
where = ["tools/python/src"]
include = ["autosar_tooling*", "ecu_tools*"]

[tool.setuptools.package-data]
ecu_tools = ["*.json"]

[dependency-groups]
build = ["cmake==4.4.4", "ninja==1.13.2"]
coverage = [
    "coverage[toml]==7.16.2",
]
quality = [
    "clang-format==22.1.8",
    "ruff==0.17.0",
    "lxml==6.1.3",
    "clang-tidy==22.1.8",
    "pre-commit==4.7.0",
]
# Not a default group: actionlint-py builds from source and downloads its checksummed binary.
workflows = ["actionlint-py==1.7.12.25", "zizmor==1.30.1"]

[tool.uv]
default-groups = ["quality", "build"]

[tool.coverage.run]
branch = true
source = ["tools/python/src"]
relative_files = true
data_file = "build/coverage/python/.coverage"

[tool.coverage.html]
directory = "build/coverage/python/html"

[tool.coverage.json]
output = "build/coverage/python/coverage.json"

[tool.coverage.report]
show_missing = true
