[project]
name = "autosar-tooling"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "tools/python/src"}

[tool.setuptools.packages.find]
where = ["tools/python/src"]
include = ["autosar_tooling*", "ecu_tools*"]

[tool.setuptools.package-data]
ecu_tools = ["*.json"]

[dependency-groups]
quality = ["clang-format==23.1.1", "ruff==0.16.9", "lxml==6.1.3"]

[tool.uv]
default-groups = ["quality"]
